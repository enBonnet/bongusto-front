name: CI

on:
  push:
    branches: [master]
  pull_request:

# One run per ref — rapid pushes replace queued runs instead of stacking.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npm test

      - name: Reader/content integrity
        run: npm run verify:reader

      - name: Build (includes pagefind indexing)
        run: npm run build
