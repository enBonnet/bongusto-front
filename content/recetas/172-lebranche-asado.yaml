historia: |-
  Con esta receta se introducen dos técnicas sencillas pero imprescindibles para preservar al máximo el sabor original de una carne: el sellado y la cocción a la plancha o a la parrilla. Y es que, al someter un pescado a la acción del fuego alto, se dora por fuera y se conservan los 
  jugos en su interior. El lebranche asado es un plato propio de la región centro-oriental del país, específicamente de la laguna de Tacarigua y Boca de Uchire, donde abunda esta especie. Cuando el pescado se envuelve con papel de aluminio, esta receta se conoce con el nombre de cachicamiao. 
  No son muchos los peces, dentro de la variada fauna marina, que superan a un tiempo el tamaño, peso, valor nutritivo y calidad del lebranche. En la preparación que aquí se sugiere, el pescado se abre como un libro para que la sal, el aceite de oliva y el ajo aromaticen la mayor superficie posible de su delicada carne.
ingredientes: |-
  ### Ingredientes (para 1 persona) 
  - 1 lebranche entero (aprox, 400 gramos) 
  - 1 cucharadita de sal 
  - 3 dientes de ajo machacado 
  - 2 cucharadas de aceite de oliva o maíz 
  - 2 limones
preparacion: |-
  1. Se lava el pescado con agua corriente y se abre de la cabeza a la cola, Se limpia bien, quitando las entrañas, pero dejando el espinazo, la piel y las escamas, pues son importantes para su cocción y sabor.
  2. Se unta con la sal, el ajo y el aceite, y se coloca como un libro abierto, con la piel hacia arriba, en una parrilla, sobre fuego hecho con leña o carbón. De prepararse en la cocina, se coloca sobre una plancha de hierro caliente a fuego alto, para conservar su grasa natural. 
  3. Se cocina durante 7 minutos, se voltea (ahora sobre su piel) y se cocina por 7 minutos más. 
  4. Se sirve entero, con limones cortados. 
  ### Sugerencia 
  - Acompañar con tostones bañados en mojo de cilantro o arepitas.
