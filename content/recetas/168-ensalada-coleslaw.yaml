historia: |-
  Esta ensalada tiene su origen probablemente en los periodos del imperio romano. No obstante el moderno coleslaw nace en el siglo XVIII tomando como origen una palabra en holandés «koolsla», una abreviación de la frase «kool salade» que viene a significar «ensalada de col».
  En inglaterra durante los años 1860 se usaba la denominación cold slaw cuando se hablaba de este plato.
  El plato se introdujo en EEUU y hoy en día se denomina en el sur «coleslaw» abreviadamente como «slaw» y de esta forma existen otras ensaladas que se denominan igual con la terminación «slaw». De esta forma existen también el broccoli slaw (brócoli) o carrot slaw (zanahoria).
ingredientes: |-
  - 1 col o repollo pequeño (o ½ si es grande)		
  - Pimienta al gusto
  - 2 zanahorias						
  - Sal al gusto
  - 3 cucharadas de mayonesa				
  - 2-3 cucharadas de azúcar
  - 1 cucharada de vinagre de vino blanco		
  - 1 cucharadita de mostaza
  - ¼ de repollo morado pequeño (No va en la original)
preparacion: |-
  1. Tenemos que cortar el col muy fino-- mucha gente usan una mandolina. Si no tienes, simplemente intenta que quede muy fino.
  2. Colocamos la col en un bol grande y cortamos la zanahoria también muy fina, estilo Julienne.
  3. Para el aliño combinamos 3 cucharadas de mayonesa con 1 cucharada de vinagre, la cucharadita de mostaza, el azúcar, y una pizca de sal y pimienta.
  4. Añadimos el aliño al bol y removemos todo muy bien para que quede mezclado. La probamos para sal y pimienta y ajustamos si es necesario.
