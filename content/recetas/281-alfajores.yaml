historia: El alfajor argentino es uno de los más conocidos y eso se lo debemos a Augusto Chammás, un químico francés que llegó a Argentina a mediados del S. XIX e inauguró una pequeña industria familiar en Córdoba que se dedicaba a la confección de dulces y confituras.
ingredientes: |-
  **Para la masa de alfajor: **
  •	100 g. mantequilla
  •	100 g. azúcar glass
  •	3 huevos de los que utilizaremos: 1 yema de huevo entera y 2 huevos enteros
  •	½ cdita. esencia de vainilla
  •	Ralladura de limón
  •	100 g. de harina trigo de todo uso
  •	200 g. de fécula o almidón de maíz
  •	½ cdita. de levadura química
  •	½ cdita. de sal
  **Para el relleno: **
  •	250 g. de dulce de leche o arequipe 
  •	Para decorar: 30 g. de coco rallado
preparacion: |-
  •	En un bol tamizamos los dos tipos de harina, la de trigo y la fécula con la levadura y la sal. Reservamos.
  •	En un bol, y con la ayuda de un tenedor, mezclamos bien la mantequilla con el azúcar. Es fundamental que la mantequilla esté a temperatura ambiente. Tiene que tener una textura de pomada para poder trabajarla y que el azúcar esté molido o sea azúcar glass, para que no se noten los granitos al final del proceso. Mezclamos bien hasta que nos quede una crema.
  •	Lavamos bien el limón (secamos) y rallamos sin llegar a la parte blanca. Incorporamos al bol con la esencia de vainilla. Añadimos la yema de huevo. Después un huevo entero y la mitad de otro una vez batido. Incorporamos a la mantequilla con el tenedor o unas varillas.
  •	Agregamos la harina y mezclamos bien con el tenedor, o la punta de los dedos hasta que tengamos una masa homogénea y muy blanda. No es necesario amasar, se trata simplemente de mezclar bien todos los ingredientes. Colocamos la masa, envuelta en papel transparente, en el frigorífico o nevera durante 20 minutos.
  **Forma de los alfajores**
  •	Una vez pasado el proceso de enfriado y compactación de la masa. Espolvoreamos una superficie de trabajo con abundante harina. Vamos a tener que espolvorear con bastante cantidad ya que la masa seguirá siendo bastante blanda. Si no tenemos la superficie bien enharinada se pegaría a la base.
  •	Colocamos parte de nuestra masa sobre la superficie de trabajo. Con un rodillo enharinado, estiramos hasta que tenga un grosor de medio centímetro. Con un cortante o un vaso de chupito, hacemos las porciones de los alfajores. Yo he utilizado un cortante de unos 5 o 6 cm. de diámetro.
  **Horneado de los alfajores y presentación final**
  •	Precalentamos el horno a 155º C con calor arriba y abajo y sin ventilador.
  •	Colocamos los alfajores en una bandeja de horno sobre papel de hornear, con mucho cuidado de no deformarlos.
  •	Horneamos durante 7 u 8 minutos a 155º C y retiramos a una rejilla hasta que se hayan enfriado totalmente. Los alfajores han de quedar bien blanquitos. Por lo que no debemos esperar a que comiencen a dorarse dentro del horno. Con esos 7 u 8 minutos será suficiente. Es fundamental controlar el tiempo de horneado para conseguir alfajores jugosos. Ya que podrían quedar pastosos y secos si los horneamos demasiado, son unos pocos minutos será suficiente.
