historia: |-
  Asado negro, un plato con alma y corazón caraqueño. Su preparación se realiza con la pieza llamada redondo de res o muchacho.
  El asado negro tiene origen colonial, y se supone que accidentalmente una cocinera dejó quemar la carne y luego remediando el daño incluyó salsas y condimentos, uniendo el dulzor del papelón con especias foráneas y ajíes dulces.
  En su color caramelizado se pueden esconder pequeñas sorpresas de aceitunas y alcaparras, cuando se hace puyao, que quiere decir que se le abren pequeños orificios a la carne y se llenan con esos ingredientes. Una preparación perfecta para compartir en la cena o un fin de semana en compañía de la familia.
  Tres características son fundamentales en un asado negro: su color oscuro, el sabor dulzón de su salsa y la presentación en rodajas. Su color y sabor provienen del uso de papelón o azúcar y de la técnica del sellado, en laque se somete la pieza de carne a un foco de calor intenso para que se dore por fuera y se caramelice con el papelón. El corte de carne utilizado para este plato es el muchacho redondo, pieza de carne compacta, fibrosa y de poca tensión muscular dentro de la res. Posee una cobertura de grasa que tradicionalmente Se deja para la 
  cocción, aunque algunos prefieren eliminarla para obtener una salsa menos grasosa. 
  La salsa también tiene sus variaciones: aunque las verduras suelen pasarse por un colador, hay quienes prefieren incluirlas en el plato.
ingredientes: |-
  ### Ingredientes (para 12 personas) 
  ### Para marinar la carne 
  - 1 muchacho redondo de 3 kg 
  - 5 cebollas cortadas en cuadros medianos 
  - 2 zanahorias cortadas en ruedas de no más de 1 cm 
  - 1 pimentón rojo cortado en cuadros medianos 
  - 1pimentón verde cortado en cuadros medianos 
  - 8 ajíes dulces cortado en cuadros medianos 
  - 4 tallos de cebollín cortado en trozos medianos 
  - 1 ajoporro cortado en trozos medianos 
  - 2 hojas de laurel 
  - 1 cucharada de comino 
  - 1 cabeza de ajo majado
  - ½ de taza de salsa inglesa 
  - 6 cucharadas de aceite vegetal 
  ### Cocción 
  - 4 cucharadas de aceite vegetal 
  - ½ de panela de papelón rallado 
  - 1 litro de vino blanco seco 
  - 1 litro de agua 
  - Sal y pimienta negra recién molida, al gusto.
preparacion: |-
  1. Dentro de un envase se colocan el muchacho redondo, las cebollas, las zanahorias, los pimentones, los ajíes, el cebollín, el ajoporro, el laurel, el comino y el ajo. Se baña la carne con la salsa inglesa y las 6 cucharadas de aceite. Se deja marinar todo por 12 horas. 
  2. Se saca el muchacho del envase y se deja escurrir. 
  3. En una olla con el aceite y el papelón, se sella la carne a fuego alto. La pieza debe quedar de color dorado oscuro, casi negra. 
  4. Una vez que la carne tenga esa tonalidad, se añade el líquido que se utilizó para marinar y los vegetales, el vino blanco, el agua, la sal y la pimienta. Se cocina todo a fuego bajo, sin tapar la olla, por unas 4 horas. 
  5. Se pasa la salsa con los vegetales por un chino o colador para que quede aterciopelada (hay quienes prefieren conservarlos trozos completos). 
  6. Se corta la carne en rodajas de 1 cm de grosor, se sumergen en la salsa y se cocinan a fuego medio por 2 minutos, Al servir, se baña con más salsa. 
  ### Sugerencia 
  - Acompañar con arroz blanco y bolitas de plátano
