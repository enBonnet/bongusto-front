historia: Es un postre económico preparado por las mujeres trabajadoras durante el difícil período de despidos masivos en los distritos industriales de Montreal durante la crisis económica de 1929.​ El pouding chômeur es una modificación del pudín de migas de pan (bread crumbs pudding) popular en las clases obreras de Inglaterra.​ Las familias debían desenvolverse con los pocos recursos que tenían y la receta al ser sencilla se propagó rápidamente en los entornos desfavorecidos de Montreal y zonas cercanas. Es una mezcla de cuatro ingredientes principales ingredientes baratos ​ en esa época (harina, agua, azúcar morena y mantequilla ​), aunque podrían agregarse otros ingredientes. Su popularidad ha dado lugar a varias versiones, en particular mediante la sustitución del azúcar morena por jarabe de arce.
ingredientes: |-
  ### Ingredientes para 6-8 comensales:
  ### Para el puding:
  - 1/2 taza de leche.				
  - 3 cucharadas de mantequilla fundida.
  - 2 cucharaditas de vainilla en polvo.	
  - 3/4 tazas de harina.
  - 1y 1/2 cucharaditas de levadura.		
  - 1/2 cucharadita de sal.
  - 2 huevos.					
  - 3/4 tazas de azúcar.
  ### Para el jarabe:
  - 1 y 1/2 tazas de azúcar moreno.		
  - 2 cucharadas de mantequilla.
preparacion: |-
  - Precalentar el horno a 175 grados centígrados.
  - Empezamos elaborando la masa del pudin, mezclando la leche, la mantequilla derretida y la vainilla en un bol pequeño.
  - En otro bol un poco más grande, colocamos la harina, la levadura y la sal.
  - Usando una batidora eléctrica, batir los huevos y el azúcar blanco aparte, hasta obtener una consistencia cremosa (unos tres minutos).
  - Añadir un tercio de la mezcla de harina/levadura/sal a los huevos, y seguir batiendo hasta que quede homogéneo.
  - Luego añadir la mitad de la mezcla leche/mantequilla/vainilla, y hacer la misma operación.
  - Continuar añadiendo ambas mezclas, e ir batiendo bien cada vez. Al terminar, apartar, porque vamos a empezar con la elaboración del jarabe.
  - Combinar el azúcar moreno y la mantequilla en una sartén y calentar hasta que se disuelvan ambos componentes.
  - Colocamos esta salsa en un recipiente de cerámica para suflés o, en su defecto, en uno especial para horno.
  - Agregar encima la masa del pudin.
  - Hornear hasta que las burbujas del sirope o jarabe empiecen a emerger por los laterales. Pinchamos con una varilla en el centro, y si ésta sale limpia, es hora de retirarlo. Esto tarda más o menos unos 40 minutos.
  - Nota: Este delicioso postre se sirve caliente y se acompaña con helado de vainilla. Hay quien añade al jarabe nueces picadas, almendras o cualquier otro fruto seco. La elección es al gusto de cada cual.
