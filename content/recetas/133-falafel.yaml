historia: A pesar de que su origen es incierto, se cree que es original de la India, donde se cocinó en un pan con especias amargas. La palabra "falafel" viene de la palabra árabe فلفل (filfil), que significa pimiento, y probablemente del sánscrito pippalī.
ingredientes: |-
  ### De 6 a 10 porciones:
  - Medio kilo de garbanzos			
  - Cilantro fresco (Opcional)
  - 4-5 dientes de ajo				
  - 1 litro de Aceite 
  - Dos cebollas medianas			
  - Sal
  - Una cucharada de levadura en polvo	
  - Perejil
  - Pimienta molida				
  - Dos cucharaditas de comino
preparacion: |-
  La preparación de esta receta de falafel requiere que metamos los garbanzos en remojo al menos 24 horas antes de preparar la masa de los mismos, así que es una receta que a la hora de hacerla tienes que prever este tiempo que se necesita antes de prepararla. De hecho si podemos dejar los garbanzos alguna hora más en remojo, mejor aún. Hay que controlar que no se queden sin agua los garbanzos, ya que en las primeras horas absorben bastante agua, así que controlad que estén siempre bien cubiertos. Debemos emplear unos buenos garbanzos lechosos secos, jamás garbanzos de bote que estén previamente cocidos, ya que el falafel no quedaría igual.
  Pasado el tiempo indicado, escurrimos los garbanzos y los colocamos sobre papel absorbente o sobre algún paño de cocina, ya que hay que conseguir que pierdan toda el agua sobrante, cuanto más secos queden los garbanzos, más sencillo será trabajar la masa una vez la tengamos lista para hacer los falafel. Una vez los tengamos bien secos, vamos a cortarlos bien, de forma que nos queden convertidos en trozos muy pequeños, sin llegar a triturarlos del todo. Para ello les recomiendo usar una picadora, que resulta muy cómoda para conseguir un buen resultado.
  A medida que vayamos cortando los garbanzos, los iremos agregando en un recipiente que sea bastante amplio. A continuación pelamos la cebolla quitándole la capa exterior, la cortamos en varios trozos y la incorporamos en la picadora. Los ajos los pelamos y los agregamos junto a la cebolla. Lavamos una buena cantidad de perejil, lo escurrimos y lo añadimos también a la picadora, junto con un poco de cilantro fresco, de forma opcional. Cortamos todos los ingredientes hasta que queden muy cortados, y los agregamos al recipiente donde teníamos los garbanzos triturados, desechando el líquido que se haya formado al picar la cebolla.
  Agregamos sal y pimienta recién molida al gusto, un par de cucharaditas de comino molido y una cucharada de levadura en polvo, y vamos a remover lo mejor posible para mezclar todos los ingredientes. La mejor forma de mezclar bien los ingredientes y conseguir una buena masa para los falafel es emplear las manos directamente, ya que así conseguiremos repartir bien los mismos y que la masa quede bien homogénea. Una vez hayamos amasado lo mejor posible, vamos a tapar la masa y la dejamos reposar entre 45 minutos y una hora.
  Una vez que la masa ha reposado y la levadura ha hecho su efecto, vamos a proceder a formar los falafel, lo que haremos con las manos, que es la mejor forma de hacerlo. Hay que hacer unas bolas que no sean demasiado grandes, de unos 4-5 centímetros, que luego aplastaremos un poco para darles la forma característica a los falafel, aunque si lo prefieres puedes dejarlos en forma de bola. Si la masa está demasiado húmeda y no te quedan consistentes las bolas, agrega harina poco a poco, a ser posible de garbanzos, a la masa y vuelve a mezclar, hasta que te quede con el punto justo para que se mantengan bien los falafel.
  Ponemos una sartén bien profunda con abundante a aceite a calentar, y una vez esté bien caliente iremos friendo los falafel, de forma que nos queden bien cubiertos con el aceite. Los freímos durante unos 5 minutos, de modo que queden más bien oscuros por fuera, y los vamos colocando sobre papel absorbente o de servilleta, para que el aceite sobrante se escurra, y al acabar los servimos para comer en caliente. Este plato se puede acompañar de alguna salsa, como puede ser salsa de yogur, salsa tzatziki, tahini, hummus o bien dentro de un pan de pita acompañado con tomate, lechuga y alguna salsita.
