historia: La historia del origen de este plato se encuentra en un hombre llamado Kundan Lal Gujral, que regentaba un restaurante en Peshawar antes de la partición de la India británica. Intentado crear nuevas recetas para mantener el interés de sus patrones, Gujral intentó cocinar el pollo en un tandoor, el cual era usado por la gente local únicamente para cocinar naans (panes). En el tandoor se alcanzan altas temperaturas y Gujral fue capaz de cocinar los pollos en ese horno de barro consiguiente cocinarlos de forma suculenta por dentro y crujiente por fuera. Después de la partición en 1947, Punjab fue dividida con una parte oriental dentro de la india y una parte occidental dentro de Pakistán. Peshawar se convirtió en parte de Pakistán y Gujral trató con muchos refugiados hindúes que huían de los disturbios y se trasladaban a la India. Finalmente Gujral trasladó su restaurante a Nueva Delhi en un lugar llamado Daryaganj. La fama del pollo tandoori ha derivado en otros platos conocidos como el pollo tikka (el cual se popularizó mucho en Gran Bretaña como Chicken Tikka Masala). El pollo tandoori puede encontrarse en la mayoría de los restaurantes indios de todo el mundo.
ingredientes: |-
  - Pollo (8-10 piezas medianas)		
  - 1 limón cortado en rodajas
  - 1 cucharada sopera de garam masala 	
  - 1 cebolla
  - 2 yogurs natural
preparacion: |-
  1. Mezclamos el yogur natural con una cucharada sopera de garam massala hasta formar una mezcla homogénea de color ladrillo (si te pasas con la cantidad de garam massala lo único que ocurrirá es que picará mucho).
  2. Añadimos la salsa a los trozos de pollo (se puede hacer tanto con muslitos, alitas, pollo en cuartos o filetes de pollo), mezclamos bien y dejamos marinar durante unas horas en la nevera (un par de horas es suficiente para que coja sabor).
  3. Calentamos el horno a 200º C e introducimos el pollo marinado con la cebolla cortada en láminas y unas rodajas de limón.
  4. Observaremos que el pollo se va dorando y tendremos que ir dándole la vuelta hasta que el pollo esté tostadito.
  5. Como acompañante, te recomiendo servir el pollo con un arroz aromático.
