titulo: Huevos a la Benedictina en salsa holandesa
id: 140
descripcion: Huevos benedictinos, son un plato que consiste en dos  tostada, u otros tipos de panes, generalmente cubiertos con jamón cocido, panceta o pastrami, huevos escalfados y la muy popular salsa holandesa.
