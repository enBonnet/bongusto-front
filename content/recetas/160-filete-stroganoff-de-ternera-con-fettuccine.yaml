titulo: Filete Stroganoff De Ternera Con Fettuccine
id: 160
descripcion: La ternera Strógonoff (lo correcto es Stroganov y no Strogonoff, que es una adaptación francesa del apellido Stroganov, en ruso) es un plato de filete de ternera cortado en tiras no muy gruesas.
