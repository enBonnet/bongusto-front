historia: "Los consomés de carnes son esenciales para elaborar salsas gustosas o arroces, El de ternera es uno de los fondos más preciados: por el suave color de su carne y porque tiene la cualidad de influir delicada y aromáticamente en cualquier preparación, sin modificarla sustancialmente, se le considera un caldo blanco. El de lagarto con hueso es de sabor más fuerte y notorio. En todo buen consomé, los huesos son muy aprovechables: del tuétano se desprende todo el gusto para el líquido. y si los huesos se hornean previamente, no es difícil obtener un caldo sustancioso (mientras más quemado quede el hueso, el consomé será más oscuro y de sabor más intenso). Además de los que se presentan en esta página, el consomé de lagarto trasero y el de rabo son muy habituales en el país."
ingredientes: |-
  - 3 cucharadas de aceite 
  - 2 zanahorias cortadas en trozos grandes 
  - 2 cebollas enteras 
  - 2 ajoporros cortados en trozos pequeños 
  - 6 ajíes dulces cortados en dos 
  - 2 cabezas de ajo enteras 
  - 2 pimentones medianos cortados en cuatro 
  - 6 granos de pimienta guayabita 
  - 1 kg de lagarto con hueso 
  - 2 litros de agua 
  - 4 hojas de laurel 
  - 2 tallos de apio españa
preparacion: |-
  1. En una olla grande, se sofríen en el aceite de maíz las zanahorias, las cebollas, los ajoporros, los ajíes dulces, el ajo, los pimentones y la pimienta durante 5 minutos. 
  2. Se agrega la carne y se deja sofreír 5 minutos más. 
  3. Se añaden los dos litros de agua y la mitad de las hierbas (laurel y apio españa). Se deja cocinar a fuego medio durante 3 horas. 
  4. Unos 5 minutos antes de concluir la cocción se agrega el resto de las hierbas. 
  5. Se retira el caldo del fuego y se pasa por un colador para separar los sólidos. Se deja enfriar. 
  6. Se retira el exceso de grasa con una cucharilla.
