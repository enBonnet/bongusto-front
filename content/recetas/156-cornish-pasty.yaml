titulo: Cornish Pasty
id: 156
descripcion: Esta especie de empanada rellena de carne y verdura es un receta británica conocida mundialmente como Classic Cornish Pasty, un pastel que fue inventado en Cornwall, al sur-este de Inglaterra.
