historia: |-
  Se trata de un plato típico para alimentar a los mineros que se encontraban dentro de las minas trabajando y no tenían tiempo para salir a almorzar, ya que es un plató fácil de guardar, sostener y comer en cuestión de minutos. Además, la corteza gruesa procuraba mantener calientes los ingredientes del interior.
  En la actualidad, este alimento es muy popular en Cornwall, donde podrás encontrar empanada de todos los sabores y tamaños, incluso con rellenos exóticos con ingredientes de otros países. Cabe decir que, aunque sea un plato muy típico inglés, aún está en conflicto la manera de elaborarse y los ingredientes que incorpora, ya que cada persona lo cocina a su gusto.
ingredientes: |-
  ### 6 a 8 porciones:
  ### Para la masa:
  - 125 gr. de mantequilla fría en dados		
  - 500 gr. de harina de trigo (y más para espolvorear)
  - 125 gr. de manteca de cerdo			
  - 6 cucharadas de agua
  -  1 huevo batido		
  ### Para el relleno:
  - 1 cebolla blanca grande en brunoise	 fino	
  - 2 papas medianas, en brunoise fino
  - 1 Zanahoria mediana en brunoise fino			
  - 350 gr. de carne de res cortada
  - Sal y pimienta
preparacion: |-
  1. Mezcla la mantequilla, la manteca y la harina usando las manos o un procesador de alimentos. Añade las seis cucharadas de agua y sigue mezclando hasta que se incorporen.
  2. Corta en cuatro partes iguales y enfría por 20 minutos.
  3. Calienta el horno a 200°C.
  4. Mezcla en un bowl la carne cortada, las cebollas, las papas, zanahoria, sal y pimienta.
  5. Aplana con rodillo cada cuarto de masa sobre una superficie enharinada, hasta hacer un círculo de aproximadamente 23 cm. de diámetro con cada pieza.
  6. Coloca un cuarto del relleno en el centro de cada círculo de masa, dejando un margen moderado hacia los bordes.
  7. Cubre con una capa de huevo batido (ayúdate con una brocha) la superficie de la masa que no esté tocando el relleno y con cuidado, une los extremos doblando el círculo en una forma de “D” sin aplastar.
  8. Pellizca los bordes para sellar y coloca sobre una bandeja con lámina de silicón o papel encerado.
  9. Hornea durante 10 minutos, luego baja la temperatura del horno a 170°C y hornea 45 minutos más.
  10. Puedes servir caliente o a temperatura ambiente.
