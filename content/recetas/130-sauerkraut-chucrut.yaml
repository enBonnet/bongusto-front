historia: Parece que las primeras referencias a la elaboración del chucrut provienen de China del norte y fue exportado hacia Europa mediante la expansión de los mongoles. Está muy presente en todas las gastronomías del este de Europa.
ingredientes: |-
  ### De 4 a 6 Porciones:
  - 1 repollo blanco grande cortado en juliana	
  - Cdta. de comino entero
  - tazas de agua					
  - 1 Cdta. de sal
  - tazas de vino blanco				
  - ½ taza de vinagre blanco
preparacion: |-
  Se pone en una olla o caldero el repollo cortado finamente con el agua, el vino blanco, el vinagre blanco, la sal y el comino entero. Se pone a cocinar por una hora tapado hasta que esté blando. Se deja enfriar y se envasa en frascos esterilizados de cristal. 
  Esta preparación mientras más tiempo tenga almacenada mejor es su sabor.
