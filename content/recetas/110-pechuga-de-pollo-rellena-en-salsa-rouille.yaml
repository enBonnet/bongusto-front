historia: |-
  Hay muchos platos de la región de Europa que comparten características con el pollo a la CordonBleu. Algunos de los países que incluyen rollitos, o enrollados de carne, en su cocina son Alemania, Francia e Italia. Casi todos ellos se basan en ternera o pollo envuelto alrededor del relleno, otracarne, queso o una combinación de cualquiera de estos. Muchos de ellos están empanados y fritos. Los nombres y recetas varían ampliamente, pero su conexión con el platillo es evidente.
  Platilloscercanos
  Salsa Rouille: proviene de la Provenza francesa, es la salsa con la que se sirve el pan en la tradicional Bullabesa, sopa de pescado. También acompaña otros platos de pescados y mariscos, aunque le viene bien a muchas otras elaboraciones.
ingredientes: |-
  ### 4 porciones:
  - 4 supremas de pollo				
  - 1 lt. De fondo de ave
  - 45 grs de mantequilla		
  - 1 rama de cebollín
  ### Relleno:
  - 1 cebolla morada		
  - 15 gras de mantequilla	
  - 1 clara de huevo		
  - 200 grs de crema de leche	
  - 45 grs de pan rallado 
  - 15 grs de hierbas bien cortadas  (Romero, orégano, salvia, mejorana, albahaca y tomillo)
  - Sal y pimienta c/n
  ### Insumos de Salsa Rouille:
  - 100 ml de aceite de oliva		
  - 25 ml de vinagre		
  - 25 ml de agua
  - 4 dientes de ajo			
  - Dos yemas de huevo	
  - Sal
  - Chile picante (Opcional)		
  - Una rebanada de pan de molde sin corteza
  - Media cucharadita de azafrán o cúrcuma.
preparacion: |-
  saltear la cebolla en mantequilla, dejar enfriar, agregar la clara de huevo previamente batidas, luego agregarle la crema de leche y pan rallado hasta lograr la consistencia, agregar las hierbas bien cortadas. Rellenar las pechugas y envolver en papel de aluminio y cocinar suavemente en el fondo de ave. Preparar la salsa, y hacer la presentación en medallones.
  Elaboración de Salsa Rouille:
  Lo primero que haremos será cortar el pan en trozos de un tamaño más bien pequeño, y los colocamos en un vaso que sea apto para utilizar la batidora en el mismo. En un cazo agregamos el agua, el vinagre y el azafrán o cúrcuma, removemos bien y calentamos hasta que nos queden todos los ingredientes bien mezclados. Al acabar agregamos la misma sobre los trocitos de pan que teníamos en el vaso de la batidora, para que se empapen bien con la mezcla líquida y se ablanden del todo al quedar bien mojados. 
  Añadimos después al vaso dos yemas de huevo, reservando las claras para otra receta, los dientes de ajo, un poco de sal y un toque de chile picante de forma opcional, y entonces comenzamos a procesar con la batidora hasta que nos quede una mezcla homogénea con todos los ingredientes bien mezclados. Verás que es una mezcla que va a quedar bastante densa, no te preocupes porque es así como debe quedar, ya que es una salsa tipo mayonesa. Ahora vamos a comenzar a agregar el aceite de oliva poco a poco y sin dejar de batir al mismo tiempo, pero esta vez a velocidad lenta, para que se integre bien y emulsione la mezcla. 
  Hay que tener en cuenta que cuanto más aceite agreguemos, más densa quedará la salsa, así que cuando consigas el grado de densidad en la textura que quieras darle a la salsa, deja de añadir más aceite.
