historia: |-
  La ciudad de Dijon (Francia) es responsable de que la cocina clásica del país adoptara un término para describir ciertas recetas, la ciudad es conocida como ‘la capital de la mostaza’, pero no es su única especialidad gastronómica, por eso, las recetas elaboradas À la Dijonnaise pueden ser variadas.
  Los platos al estilo de Dijon o à la Dijonnaise reconocen indistintamente las preparaciones que incluyen entre sus ingredientes la mostaza de Dijon cuando se refiere a platos salados, o el cassis cuando se habla de platos dulces.
ingredientes: |-
  - ½ cucharas mantequilla sin sal
  - 1 cucharadas aceite de oliva
  - 1 pechuga pollo sin piel y deshuesadas
  - ½ chalotes 
  - 50ml vino blanco
  - 2 dientes ajo
  - 50ml crema espesa doble
  - 1 cucharadas mostaza Dijon
  - 1 cucharadas estragón fresco o una cucharadita si es seco
  - 1 cucharadas tomillo seco
  - 2 cdas perejil finamente cortado
  - 100ml caldo 
  - Sal y pimienta.
preparacion: |-
  - En un sartén derrita la mantequilla con una cucharada de aceite de oliva agregue las pechugas de pollo cocine bien por ambos lados, pase a un plato tape con papel de aluminio y reserve.
  - Agregue al sartén la mantequilla restante coloque el chalote y saltee, luego agregue el vino, el caldo y el ajo deje hervir hasta que reduzca a la mitad integre la crema y la mostaza cocine 3 min. Siempre batiendo. Agregar las hierbas Salpimentar. Vuelva a colocar las pechugas en la mezcla del sartén cerca de 5 min. Servir acompañada de chip y rúcula.
