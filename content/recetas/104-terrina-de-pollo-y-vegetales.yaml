historia: El origen de la Terrina se remonta a los banquetes del Imperio Romano donde se realizan ya combinaciones de alimentos como la terrina de queso, higos y castañas. A partir de allí la terrina ha ido evolucionando de acuerdo con los gustos y variedad de aliemntos de cada lugar.
ingredientes: |-
  6 porciones:
  - 300 grs. De pechuga de pollo limpia		
  - 200 grs. De panceta en lonjas (Tiras)
  - 100 grs. De crema de leche			
  - 2 claras de huevo
  - 2 rodajas de pan 				
  - 1 zanahoria
  - 1 pimiento rojo				
  - 1 zapallito largo o calabacín (zucchinni)
  - Leche, sal y pimienta C/N.
preparacion: |-
  - 1. Lavamos muy bien los vegetales y los cortamos en daditos chicos.
  - 2. Remojamos las rodajas de pan  leche con una pizca de sal.
  - 3. Cortamos la pechuga en dados y las colocamos en un vaso de mixer, agregamos las migas de pan ya húmedas (en leche), las claras de huevo y procesamos hasta formar una pasta.
  - 4. Incorporamos los vegetales y la crema de leche y mezclamos bien.
  - 5. Forramos el molde de terrina con las lonjas de panceta y vertemos la mezcla, posteriormente cerramos las lonjas de manera que quede algo parecido a un paquete.
  - 6. Colocamos la Terrina en una bandeja o fuente de horno con agua (Baño de María) y cubrimos con papel aluminio (ambas bandejas).
  - 7. Llevamos a un Horno precalentado a 170ºC por 50 minutos aproximadamente, retiramos, desmoldamos y dejamos que se enfríe.  Una vez Fría, Cortamos y Servimos.
