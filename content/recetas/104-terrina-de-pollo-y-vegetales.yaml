titulo: Terrina de Pollo y Vegetales
id: 104
descripcion: Terrina, del francés “terrine”, es un recipiente de barro, de cerámica o de hierro esmaltado, dentro del cual se ponen alimentos para su cocción y conservación.
publico: true
categorias:
