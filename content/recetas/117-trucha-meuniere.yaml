historia: Su origen es incierto, porque, si bien el nombre, cuya traducción es molinera en castellano, alude al rebozado en harina, y este procedimiento culinario es muy antiguo, el aporte de la salsa de mantequilla tostada y limón es la verdadera identidad del plato y parece una técnica más moderna. Esta receta ha viajado con la cultura francesa allá donde ésta ha dejado su impronta, así pues, la encontramos arraigada en la gastronomía criolla de Louisiana en el sur de Estados Unidos, donde Francia estableció una colonia entre los siglos XVII.
ingredientes: |-
  ### 3 Porciones:
  - 3 truchas despinadas				
  - ½  tza de harina de trigo
  - 100 grs. De Mantequilla sin sal 		
  - 3 cdas de mantequilla clarificada
  - 3 cdas de de jugo de limón			
  - 3 cdas de perejil cortado en hache
  - ½ cdta de pimienta				
  - 2 cdtas de sal.
preparacion: |-
  Lavar y secar bien las truchas, aparte mezclar la harina con la sal y la pimienta, y pasar las truchas por esa mezcla, y freírlas en mantequilla  a fuego medio por 4  minutos por cada lado, aparte clarificar la mantequilla a fuego bajo, dejar reposar para que se precipiten los sólidos de la leche, retirar los sólidos y dorar un poco la mantequilla, mezclar con jugo de limón y perejil en hache. Al final napar  las truchas.
  Nota: podemos sustituir las truchas por bonito pequeño, cataco o peces blancos.
