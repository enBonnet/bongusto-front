historia: |-
  Se trata de un aderezo que realza el sabor de otros platos. Suele prepararse con hierbas o vegetales molidos (o diminutamente cortados), aceite y vinagre. Los más conocidos son los 
  mojos trujillanos, que admiten muchas variaciones de ingredientes y suelen ser servidos en el desayuno, como acompañante de las arepas. Acompañan muy bien papas, yuca hervida, carnes, hallaquitas, hervidos o sopas.
ingredientes: |-
  ### Ingredientes (Para 4 tazas de mojo) 
  - 3 cebollas medianas peladas y cortadas en cuatro (unos 225 gramos) 
  - 16 dientes de ajo pequeños y majados (¼ de taza) 
  - 3 tazas de hojas de cilantro, preferiblemente no florecido 
  - 1 taza de hojas de perejil 
  - 2 o 3 ajíes picantes, de unos 5 cm de largo (1 ½ cucharadas, si es ají seco molido) 
  - ¼ de taza de pan duro rallado 
  - 1 taza de consomé de carne 
  - ½ taza de aceite 
  - ½ taza de vinagre 
  - ½ cucharadita de pimienta negra recién molida 
  - 2 cucharaditas de sal 
  - 1 cucharada de pimentón rojo seco molido (páprika)
preparacion: |-
  1. Con una máquina demoler maíz, se trituran las cebollas, los ajos, el cilantro, el perejil y los ajíes, de manera que quede una pasta gruesa. Se mezcla con el pan rallado. 
  2. En una cacerola no muy grande se coloca el preparado y se agrega el consomé de carne, el aceite, el vinagre, la pimienta negra, la sal y el pimentón molido. Se cocina a fuego fuerte durante 12 minutos, o hasta que adquiera un color verde amarillento oscuro y consistencia espesa.
