historia: La salsa bordelaise es una preparación francesa popular que se agrega con frecuencia a las carnes y otras preparaciones saladas. Llamada así por la región productora de vino de Burdeos, Francia, esta abundante salsa generalmente involucra una base de vino y caldo. La salsa Bordelaise es una característica común en los menús de inspiración francesa en todo el mundo y puede agregar un sabor sofisticado a una amplia variedad de platos.
ingredientes: |-
  - 2 solomillos troceados 
  - Aceite de oliva 
  - 1cebolla en julianas 
  - 1 diente de ajo laminado
  - 1 cucharada sopera de harina 
  - 1 vaso de fondo negro 
  - 1 vaso de vino tinto 
  - Sal y pimienta
preparacion: |-
  - Primero preparamos la salsa:
  - Añadimos aceite en una sartén, añadimos la cebolla, el diente de ajo laminado y lo cocinamos a fuego bajo.
  - Cuando esté pochado añadimos 1 cucharada sopera de harina, el vaso de caldo y el vaso de vino tinto. Lo tapamos y lo tenemos al fuego (bajo) por 20 min lo salamos al gusto, removemos constantemente hasta que espese.
  - Calentar un sartén o plancha con aceite caliente, pasamos los solomillos sólo vuelta y vuelta, salpimentándolo al gusto, hasta dorar por ambos lados, dejándolos al termino deseado. 
  - Servir y napar con la salsa.
