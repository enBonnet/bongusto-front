historia: Una receta tradicional del campo de la cuenca de Rennes, el miton rennais (o cocido a fuego lento con leche) es una panada nutritiva, “cocida a fuego lento” durante mucho tiempo. Cuanto más se trabaja con cuchara de madera, más finura adquiere. Solo puede variar la cantidad de pan. ¡En algunas familias, la panade podía ser tan espesa que el cucharón se quedaba derecho en la sopera!
ingredientes: |-
  - 250 g de pan de campo duro en trozos 
  - 1 cebolla grande en brunoise
  - 25 cl de leche
  - 20 g de mantequilla
  - 1 yema de huevo
  - 1 cda. cucharadas de azúcar glass
  - Sal
  - Pimienta
preparacion: |-
  - Poner a hervir un litro de agua en una cacerola. Añadir el pan de molde y la cebolla. 
  - Sal, pimienta y endulza ligeramente. 
  - Cocine por 30 minutos a fuego lento, revolviendo con una cuchara de madera para que el pan no se pegue. 
  - El mitón debe tomar una consistencia cremosa y lo más fina posible. 
  - Justo antes de servir, espese con la leche, la yema de huevo y la mantequilla. 
  - Verter en una sopera y servir inmediatamente.
  - Acompañar con pan de costra dura.
