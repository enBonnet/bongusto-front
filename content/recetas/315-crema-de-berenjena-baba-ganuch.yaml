historia: Se considera que el baba ganoush representa el amor que existe entre una hija y su padre, pues según la leyenda la receta fue creada por una mujer que al ver que su progenitor, de una edad avanzada, ya no podía masticar los alimentos decidió prepararle un platillo con vegetales machacados.
ingredientes: |-
  - 3 berenjenas medianas
  - 3 dientes de ajo pequeños
  - Aceite de oliva
  - Sal al gusto
preparacion: |-
  - Cocina las berenjenas a fuego directo, es decir, en una cocina a gas pon las berenjenas directamente sobre las llamas y deja que se vaya quemando la piel por todas partes. Dale vuelta las veces que sea necesario para que se cocinen de manera uniforme.
  - Tus berenjenas deberían quedar suaves por dentro.
  - Nota: si tu cocina empieza a oler a quemado, no te preocupes, significa que tus berenjenas van por buen camino.
  - Una vez esté chamuscada toda la piel de la berenjena, debería estar negra toda, retírala del fuego y pélala bien, que no le quede nada de lo “quemado”.
  - A continuación, Trocéalas con un cuchillo y ponlas junto a los dientes de ajo previamente picados, una pizca de sal y un chorro generoso de aceite de oliva en un procesador de alimentos o un picador hasta que quede con una contextura cremosa.
