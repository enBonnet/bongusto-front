historia: |-
  Esta sopa es una tradición que puede haber tenido su origen dentro del mercado de alimentos más grande del mundo en París, conocido como Les Halles, fundado en 1135 por el rey Philippe-Auguste.
  Este lugar abrió sus puertas como un simple mercado de comida al aire libre, creció rápidamente y pronto se requirió un muro para mantenerlo separado de su vecino, el cementerio de Los Santos Inocentes.
  A principios del siglo XIX, la ciudad se vio obligada a trasladar los huesos del cementerio a las Catacumbas, dejando espacio para que el mercado se convirtiera en lo que el novelista Emile Zola llamaría “el vientre de París”.
ingredientes: |-
  ### 4 Porciones:
  - 3 cebollas grandes.	
  - 15 ml de aceite de oliva extra virgen (2 cucharadas)
  - 30 g de mantequilla			
  - 1 diente de ajo.
  - 1 litros de caldo de carne
  - 9 rebanadas de pan del tipo baguette		
  - 1 ½ cucharadas de harina de trigo
  - 1 cucharadita de azúcar		
  - Sal y pimienta negra recién molida (al gusto)
  - 9 ml de brandy o coñac		
  - 100 g de queso rallado suave que
preparacion: |-
  Pelamos y cortamos en juliana las cebollas. Reservamos en un cuenco.
  Elegimos una cazuela grande, calentamos el aceite en el fondo de la cazuela. Añadimos la mantequilla, que es la verdadera base de esta sopa francesa.
  Cuando se haya derretido y mezclado con el aceite de oliva introducimos las cebollas y el ajo majado. Añadimos también un poco de sal y pimienta negra. El efecto salado nos ayudará a que las cebollas suden y que se ablanden antes.
  Removemos con una cuchara de madera de manera envolvente hasta que la cebolla quede transparente o translúcida, no debe coger color.
  Este proceso es lento porque queremos tener la cebolla blandita sin que se queme. Con fuego muy suave tardaremos unos 15-20 minutos.
  Podéis tapar o no la cazuela durante la cocción aunque si la tapáis el agua que va soltando el sofrito quedará en la cazuela y evitará que la cebolla tome color tostado.
  Luego que la cebolla esté traslucida es el momento de agregar una cucharada de azúcar. Aunque debemos tener cuidado de que no caramelice muy rápido para que la cebolla no quede con color.
  Espolvoreamos la harina en la cazuela y removemos con cuidado para mezclarla bien. El efecto de la harina con la cebolla y sobre todo la mantequilla se llama Roux, nos ayudará a ligar y espesar la sopa.
  Añadimos el brandy y dejamos 1-2 minutos que se evapore.
  Introducimos el caldo, de carne o de lo que más nos guste, por ejemplo pollo, pescado o verduras (así le daréis vuestro toque a la sopa). Salpimentamos si es necesario y llevamos a ebullición. Dejamos 15-20 minutos a fuego muy suave.
  La sopa tiene harina y si incrementamos la temperatura se irá al fondo de la cazuela. Se pegará pudiendo llegar a fastidiarnos la receta.
  Cortamos en rebanadas finas el pan y tostamos ligeramente.
  Untamos con un trozo de ajo y colocamos en la superficie de la cazuela o en cuencos individuales con la sopa y las tostadas por encima.
  Espolvoreamos con el queso suave que más nos guste (yo he utilizado parmesano).
  Metemos al horno precalentado a 200º. Gratinamos a 220º durante 5-6 minutos y servimos inmediatamente bien caliente.
  La elaboración de esta sopa es muy fácil, aunque puede que un poco laboriosa. Una sopa líquida pero con un punto de almidón que le da una textura entre sopa y crema, lo que le da a la sopa de cebolla ese toque único.
