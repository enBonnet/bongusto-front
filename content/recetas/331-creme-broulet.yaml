titulo: Créme Broulet
id: 331
descripcion: Es un postre que consiste en una crema cuya superficie se ha espolvoreado de azúcar con el fin de quemarlo y obtener así una fina capa crujiente de caramelo.
publico: true
categorias:
  - postre
photo:
  url: https://res.cloudinary.com/enbonnet/image/upload/v1654975216/xf1y8py5ubkepkweojch.png
  alt: Créme Broulet
created_at: 2022-06-11T19:20:16.123Z
updated_at: 2022-06-11T19:20:16.123Z
historia: 'Se considera que la primera mención de la crème brûlée aparece en Francia, en el libro de cocina Nouveau cuisinier royal et bourgeois de François Massialot, publicado en 1691. La crema empleada entonces era a base de yema de huevo y leche con una pizca de harina. Este cocinero de Felipe I de Orleans precisa en su recetario que: "Es necesario echar bastante azúcar encima, a parte del azúcar que se echa dentro: se coge la paleta del fuego, al rojo vivo; y a la vez se quema con ella la crema a fin de que coja un hermoso color oro.'
ingredientes: |-
  - ½ litro de leche entera
  - ½ cucharadita de vainilla
  - 3 yemas de huevo
  - 50 g de azúcar
  - 1 lajita de canela
  - 4 a 5 cucharadas de azúcar para caramelizar
preparacion: |-
  - En una olla, colocamos la leche con la vainilla y la canela. Calentamos a fuego bajo durante unos 10 minutos, teniendo cuidado de que no hierva. Retiramos del fuego y dejamos reposar media hora.
  - Encendemos el horno a 160°C y ponemos dentro una bandeja donde entren todas las cazuelitas. Pondremos en la bandeja 2 o 3 dedos de agua para que se vayan calentando con
  - el horno.
  - Una vez que la leche ha reposado, la colamos para eliminar la canela. En un bol batimos las yemas con el azúcar hasta que estén espumosas. Luego vamos agregando la leche de a poco, sin dejar de batir, hasta que esté todo integrado.
  - Ponemos la crema que hemos preparado en una olla y la cocinamos al fuego medio, siempre
  - removiendo, hasta que comience a espesar. Llevará 3 o 4 minutos.
  - Vertemos la crema en las cazuelas, y las colocamos en la bandeja con agua que teníamos en el horno. El agua debería llegar hasta la mitad de las cazuelas. Horneamos por 30 minutos, retiramos y dejamos enfriar.
  - Cubrimos cada creme brulée con una cucharada abundante de azúcar, y con un soplete de cocina quemamos la superficie hasta que el azúcar se dore. El punto de tostado es a gusto, lo importante es que el azúcar se caramelice formando la capa crujiente.
  - Dejamos que el caramelo se enfríe y solidifique.
