historia: Según la historia el cóctel Tequila Sunrise fue creado en el Hotel Arizona Biltmore Resort & Spa de Phoenix entre los años 1930 y 1940. ... Gene Sulit le sorprendió con una bebida a la que llamó Tequila Sunrise por la forma de los colores del cóctel preparado que se asemejaban a la salida del sol.
ingredientes: |-
  - Vaso: Lo mejor seria presentarlo en una copa huracan, puede ser en vasos altos
  - Hielo picado (H.P) o en Cubos (H.C)
  - Tequila
  - Jugo de naranja (Preferiblemente pasteurizado)
  - Granadina
  **Decoración: **
  - Rodaja de Naranja
  - Guinda o cereza
  - Removedor de Bebidas
  - Pitillos o Pajillas
  - Sombrilla
preparacion: |-
  - Agregar al vaso alto hielo 
  - Agregar sobre el hielo 1 ½ onza de tequila. Si la copa o vaso es muy alta 2 onzas
  - Completar con jugo de naranja
  - Agregar sobre el jugo de naranja un aproximado de ½ onza de granadina esparciendola por toda la superficie superior del coctel de manera que esta al caer por grabeda al findo de la copa haga el efecto deseado. 
  **Decorar:**
  - Rodaja de naranja con cereza y sombrilla
  - Colocar removedor de bebidas y pitillo
