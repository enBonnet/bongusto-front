historia: |-
  La bandeja paisa es un plato herbolario conocido también como bandeja de arriero o bandeja montañera, típico de la Cocina antioqueña, correspondiente a los actuales departamentos de Antioquia, el Viejo Caldas o Eje Cafetero (Caldas, Quindío y Risaralda), parte del norte del Valle del Cauca y el norte del Tolima en Colombia.

  Característica fundamental de este plato es su enorme abundancia, tanto en cantidad como en variedad de alimentos, de tal modo que, la bandeja paisa completa solo cabe servirla en platos grandes llamados bandejas.


  En su forma y composición actual, es un plato de desarrollo reciente: no aparecen referencias en los libros de cocina anteriores a 1950 ni en otros documentos anteriores a esa fecha. Es probablemente una evolución comercial, desarrollada en los restaurantes antioqueños de Medellín, Bogotá y otros sitios de Colombia, del tradicional "seco" antioqueño, compuesto por arroz, frijol, carne, algo de frito y plátano, y acompañado por arepa. También puede haber evolucionado a partir de otro plato de común usanza en la región, inclusive hoy, conocido ampliamente como "Típico Montañero" o simplemente "Típico".
ingredientes: |-
  ### 6 porciones:
  - * 3 tazas de frijoles cargamanto			
  - * Sal, pimienta y cominos al gusto
  - * ½ kilo de pezuña cerdo cortada			
  - * 1 kilo de carne molida
  - * 2 plátanos verdes en pedacitos			
  - * 1 cucharada de cilantro picado
  - * 1 litro de fondo de ave o carne			
  - * 4 dientes de ajo picado
  - * 1 zanahoria picada					
  - * 8 cucharadas de aceite
  - * 2 kilos de tomate rojo picado			
  - * 6 tallos de cebollín
  - * ½ kilo de cebolla rallada				
  - * Aguacate maduro.
  -
preparacion: |-
  ### Preparaciones previas:
  - Arroz blanco preparado (3 tazas) 			
  - ½ kilo de chicarrón (con carne)
  - Tajadas (3 plátanos maduros) 			
  - ½ kilo de chorizo asados
  - Huevos fritos	necesarias				
  - 1 Aguacate en tajadas
  - Arepas necesarias
  ### Preparación:
  - 1. La víspera, remoje los frijoles en agua que los cubra.
  - 2 En la misma agua ponerlos a cocinar en la olla de presión a fuego medio con la pezuña, la zanahoria, ½ litro de fondo, los plátanos picados. Cuando pite la olla reduzca el fuego 30 minutos.
  - 3. Pasados los 30 minutos, añada un guiso preparado con la mitad de los tomates y la cebolla larga picada y sazone al gusto. Dejar conservar destapado hasta lograr la consistencia deseada.
  ### Preparación de la carne:
  - 1. Sofreír en aceite el tomate, la cebolla y los dientes de ajo machacados.
  - 2. Añadir la carne y un poquito de agua. Revolver bien hasta que la carne dore. Salpimentar
  ### Observaciones:
  - Servir los frijoles y la carne con arroz blanco, chicharrón, chorizo, tajadas de plátano maduro, huevo frito, aguacate y arepa.
