historia: El origen de “Pastel imposible” no está definido. Se le atribuye tanto a Italia como a Perú y últimamente se otorga el mérito de su creación a los mexicanos. Sin embargo, independientemente de su origen, este postre de dos texturas combinadas es altamente consumido en México; sobre todo en festividades.
ingredientes: |-
  Insumos para la preparación en un molde de 16 centímetros de circunferencia y 9.5 de alto, lo que sería la qué-sillera normal.
  ## Caramelo:
  •	1/2 taza de azúcar
  •	2 cucharaditas de agua
  ## Torta:
  •	100 grs de harina de trigo todo uso 
  •	1 huevo
  •	100 grs de azúcar
  •	75 grs de margarina o mantequilla sin sal
  •	½ cucharadita de esencia de vainilla
  •	Ralladura de 1 limón 
  •	Pizca de sal (nota si la mantequilla o margarina es con sal, omitir más sal)
  •	1/3 taza de leche líquida o agua
  ## Quesillo:
  •	1 huevo
  •	200 grs de leche condensada (1/2 Lata)
  •	200 grs de agua
  •	2 cucharadas del licor de su preferencia
  •	1 cucharadita de esencia de vainilla
  •	1 cucharada de fécula de maíz 
  •	2 cucharadas de leche en polvo
preparacion: |-
  •	Precalentar el horno a 200°C
  •	Montar de 4 a 5 litros de agua a fuego alto. La idea es que hierva 
  •	Preparamos el caramelo; En el molde a utilizar agregar el azúcar y el agua, llevar al fuego hasta que comience a burbujear y tornándose color caramelo, dejarlo hasta que se torne del color deseado. Nota: mucha vigilancia a que se quema muy rápido.
  •	Luego retiramos del fuego y tratamos de esparcir por el fondo del molde, hasta más o menos la mitad del molde o aproximadamente 4 centímetros de manera pareja. Dejamos enfriar aparte.
  •	Una vez frio el molde con el caramelo. Aceitar la parte del molde que no tiene caramelo y reservar.
  •	Preparamos la torta; Cremar la margarina con el azúcar hasta que se disuelva el azúcar.
  •	Integramos el huevo sin dejar de remover, hasta que se forme una masa homogénea
  •	Incorporar la ralladura de limón.
  •	Agregar la harina junto al polvo de hornear, tamizando e incorporando en forma envolvente, hasta incorporar todo.
  •	Incorporar la esencia de vainilla
  •	Agregar la leche o agua poco a poco en el momento que estemos incorporando la harina.
  •	Agregamos la mescla de la torta al molde que ya tenemos con el caramelo y aceite.
  •	Preparación del Quesillo; Incorporamos los insumos a procesar en la licuadora
  •	Una vez incorporados todos los ingredientes lo agregamos el molde donde ya tenemos la mezcla de la torta, esto utilizando una espátula para que la mezcla no caiga directamente sobre la mezcla de la torta y no deforme la superficie donde cae.
  •	NOTA: Va 1ro la mezcla de la torta, sobre el caramelo y luego la del quesillo en la parte que esta aceitada.
  •	Tapamos el molde con su tapa, lo colocamos en una tortera amplia en el centro y agregamos agua caliente que cubra la mitad del molde donde tenemos la mezcla.
  •	Llevamos al horno en la parte media de este, bajamos la temperatura a 180°c y lo dejamos por 1 ½ hora.
  •	Transcurrido el tiempo sacamos del horno introducimos un cuchillo para verificar que este cocida la torta. La torta en este momento esta en la superficie, por lo tanto, se introduce el cuchillo solo hasta la mitad.
  •	Una vez comprobada la cocción de la torta, dejamos enfriar a temperatura ambiente, luego lo llevamos a la nevera hasta que se enfrié bien, preferiblemente de un día para otro.
  •	Antes de desmoldar verificamos que se despegue de los lados del molde y desmoldamos.
