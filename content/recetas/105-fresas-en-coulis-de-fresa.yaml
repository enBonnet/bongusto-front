historia: Un coulis es un tipo de salsa procedente de la cocina francesa. Su terminología ha avanzado tanto como ha avanzado la cocina, lo que en un principio era una elaboración de carne espesada que daba cuerpo y sabor a las salsas, ha pasado a ser también una salsa o puré dulce o salado, de frutas y de vegetales, elaborado por cocción, por maceración, etc.
ingredientes: |-
  - 500 gramos de fresas		
  - 1/2 limón (opcional)
  - 300 gramos de azúcar	 
  - 250 ml de agua
preparacion: |-
  - Lava las fresas y quítales el rabillo verde. Pon a escurrir. Y reservar las mejores. 
  - Ahora vamos a hacer el almíbar. Es muy sencillo, solo tienes que poner en una olla a fuego lento el agua y el azúcar y remover durante 10 a 15 minutos hasta que todo el azúcar esté bien diluido.
  - Corta las fresas a la mitad, ponlas en el vaso de la batidora.
  - Exprime el medio limón y agrégalo en el vaso con las fresas (si prefieres puedes pasar del limón, también sale muy rico).
  - Cuando el almíbar esté listo viértelo sobre las fresas, espera cinco minutos para que las fresas suelten todo su jugo y después tritúralo todo con la batidora.
  - Después pasa el coulis por un colador (si quieres quitarle las pepitas de las fresas y los restos que puedan quedar) y deja que se temple un poco antes de meterlo en la nevera.
  - Servir la cantidad necesaria de coulis en una fuente para postre y agregar 1 o 3 fresas frescas. Se puede servir así o decorado con crema chantilly o hojas de hierbabuena.
