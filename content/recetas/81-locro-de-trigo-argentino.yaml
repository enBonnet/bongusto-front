historia: "Como cada 25 de mayo, hoy el pueblo argentino compartirá una receta tan particular como especial: el locro. Se trata de una suerte de guiso de origen prehispánico y preincaico, típico de varios pueblos andinos que basaban gran parte de su dieta en el maiz o los porotos y la papa. Se lo prepara según multitud de recetas, siendo lo único invariable su base vegetal y el procedimiento de cocción, a fuego lento durante varias horas."
ingredientes: |-
  ### 8 Porciones:
  - ¼ kg de judías secas				
  - Sal c/n
  - ½ kg de tocino salado				
  - ½ kg de papa
  - ½ kg de huesos de cerdo salados		
  - ½ kg de auyama
  - ½ kg de trigo pelado				
  - 2 chorizos rojos
  - ½ kg de carne de falda			
  - 2 chorizos blancos
  - ### Para la salsa picante:
  ¼ kg de ajos					
  - Sal c/n
  - 1 pimentón rojo				
  - 1 cda de chile molido
  - ¼ de lt. De aceite				
  - ½ taza de fondo
  - 1 hoja de laurel				
  - 1 cda. De pimentón dulce
preparacion: Lavar y remojar de un día para otro las judías secas, aparte hierva agua y blanquee el tocino y los huesos de cerdo por tres minutos quite el exceso de grasa y corte en bastones y reserve, parta los huesos salados en trozos pequeños y reserve. Coloque el trigo en una olla grande y cúbralo con agua hirviendo, llévelo al fuego por dos minutos cuando empiece a hervir agregar dos tazas de agua fría y apagar, cuando el trigo se haya abierto agregue la carne de falda cortada en trozos y lleve al fuego hasta que empiece a hervir, baje el fuego y agregue el tocino y los huesos salados y deje hervir por espacio de  ½ hora, cuando tenga aspecto de guiso agregar los chorizos cortados en rodajas, las judías la auyama y las papas, cocine revolviendo de vez en cuando, hasta que las verduras estén blandas, agregar sal al gusto.
