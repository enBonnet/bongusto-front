historia: |-
  Antes de continuar, es importante mencionar que no hay una historia oficial de cómo se creó la margarita. Sin embargo; algo es seguro. Esta surgió en algún lugar dentro de Baja California.
  La teoría más creíble, sucedió en la Cantina Hussong en Ensenada. Resulta que una noche, un camarero llamado Carlos Orozco se encontraba experimentando con nuevas bebidas, cuando de pronto, llamó su atención una mujer de singular belleza. Entonces, ignorando completamente su procedencia, se acercó a ella y le preguntó - ¿Quisiera probar una bebida de mi creación? –. A lo que ella respondió – Claro que sí -. Tras quedar maravillada con su refrescante sabor, le preguntó a Orozco sobre el nombre de la original bebida. A lo que él respondió con otra pregunta - ¿Cómo se llama usted? -. Sin saberlo, era nada más y nada menos que Margarita Henkel, la hija del embajador alemán. En ese justo momento, el creativo camarero anunció todos en el bar que su nueva creación compartiría el nombre de esa bella mujer.
ingredientes: |-
  - Copa Margarita
  - sal
  - tequila
  - Cointreau o triple C
  - Jugo de limón
  - jarabe de goma
  - Hielo picado
  - **Decoración:**
  - Rueda de limón
preparacion: |-
  - En el vaso de la licuadora, agregar:
  - 1 ½ onza de tequila
  - 1 onza de Cointreau o triple C
  - ½ onza de jugo de limón
  - ½ onza de jarabe de goma
  - La cantidad de hielo a ser usado, es la misma capacidad de la copa a ser usada. 
  - Agregar el hielo lentamente, mientras se estan procesando los ingredientes y cuando ya tenga la consistencia de frozzen dejar de agregar hielo.
  - Antes de servir decorar la copa con una crusta de limón y sal, servir y decorar con rueda de limón.
