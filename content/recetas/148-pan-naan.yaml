historia: |-
  Naan es una palabra que significa “pan” en persa. En cuanto a su origen, se dice que es resultado de un experimento después de la llegada de la levadura a Egipto, pero otra teoría dice que fue inventado por los mogoles y los persas alrededor de 1520.
  Los panes en la India eran principalmente chapatis y rotis, alimentos que se crearon durante la cultura de Harappan, cuando también se cultivaba el trigo, pero a la civilización le tomó otros 100 años obtener una variación de pan fermentado utilizando el famoso horno tandur.
ingredientes: |-
  ### De 8 a 10 Porciones:
  - 180 ml de agua caliente			
  - Sal marina
  - 125 ml de yogur desnatado			
  - Mantequilla fundida
  - 2 cucharadas de aceite vegetal		
  - ½ cucharadita de sal
  - 8 g de levadura instantánea			
  - 375 g de harina todo uso
preparacion: |-
  1. Para comenzar, en un bol, agregamos el agua, el yogur, la levadura, 2 tazas de harina, la sal y el aceite.
  2. Formamos una bola de masa y la trabajamos. Vamos integrando en ella la harina restante. Estiramos, giramos y doblamos la masa durante 3 minutos. Dejamos reposar la masa durante 1 hora para que suba.
  3. Pasado el tiempo, dividimos la masa en 6 porciones y las estiramos, dejando unos 20-22 cm de diámetro y unos 6 mm de grosor.
  4. Cocinamos los panes en una sartén sin aceite ni mantequilla durante 90 segundos por cada lado.
  5. Pintamos con mantequilla los naan y espolvoreamos sal marina.
  6. Servimos.
