historia: |-
  El pebre es una salsa del tipo adobo típica de Chile, parecida al chancho en piedra chileno, a la llajua boliviana, a las salsas criollas peruanas y rioplatentenses, al pico de gallo mexicano y al ajicero venezolano. Se usa para aderezar caldos, porotos granados, carnes o choripanes en un asado. También se sirve con tortilla de rescoldo, sopaipillas o simplemente con pan (churrascas, hallulla o marraqueta).
  No tiene un origen definido
ingredientes: |-
  - 2 tomates pelados				
  - 1 cucharada de aceite
  - 1 mediana cebolla				
  - 2 cucharadas de jugo de limón
  - 4 cucharadas de cilantro picado		
  - 1/2 cucharada de sal
  - 1 ají¬ verde, cortado fino
preparacion: |-
  Pelar los tomates, en una olla con agua hirviendo, retírelos y luego póngalos en agua fría. Retire la piel. 
  Corte los tomates en cuadritos pequeños. 
  Corte la cebolla también en cuadritos, pero no muy finos. Ponga la cebolla en un bol de mediano tamaño y cubrir la cebolla con agua hirviendo. Deje en remojo por un minuto. Escurra, y enjuague bien con agua fría. Ahora... 
  Mezcle los tomates, cebolla, cilantro, ají, sal, jugo de limón, y aceite.
