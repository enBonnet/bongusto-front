historia: La tradición dice que la Tarte Tatin fue creada por accidente en el 'Hotel Tatin' en Lamotte-Beuvron, Francia en 1889, lugar del que deriva el nombre. El hotel era regentado por dos hermanas, Stéphanie Tatin (1838–1917) y Caroline Tatin (1847–1911). Existen múltiples versiones acerca del origen de la tarta, pero la historia más aceptada menciona que un despiste de Stéphanie Tatin hizo que se cocinaran más de la cuenta las manzanas, y para no desperdiciarlas le pusieron la pasta encima y la hornearon, y después le dieron vuelta con cuidado, dando lugar a esta variante tan conocida en la cocina francesa.
ingredientes: |-
  **Para 6 personas**
  - 250 g Harina de repostería
  - 160 g Mantequilla para la masa
  - 50 ml Leche
  - 5 g Sal
  - 15 g Azúcar para la masa
  - 1 yema de huevo Mediano
  - 1 kg Manzana (aproximado 4 manzanas) 
  - 200 g Azúcar para el relleno
  - 75 g Mantequilla para el relleno
preparacion: |-
  - Comenzaremos preparando la masa. Para ello ponemos la harina y la mantequilla en dados bien fría en una superficie de trabajo. Con los dedos vamos cubriendo los dados de mantequilla con la harina. Luego con ambas manos trabajamos la mezcla hasta conseguir una textura arenosa.
  - 
  - Hacemos un hueco en el centro y añadimos la leche y la yema de huevo. Vamos incorporando esto con los dedos, y cuando el líquido haya sido absorbido usamos las manos para mezclar la masa hasta que tenga una textura suave. En cuanto se unan los ingredientes estará lista. La envolvemos en film y la dejamos una hora reposar en la nevera.
  - 
  - Mientras preparamos el relleno. Pelamos y cortamos las manzanas en cuartos y en una sartén o cazuela refractaria hacemos un caramelo suave con el azúcar y la mantequilla hasta que se vuelva marrón, pero no demasiado oscuro. Añadimos la manzana y cocemos todo junto durante veinte minutos. Dejamos reposar media hora hasta que enfríe.
  - 
  - Precalentamos el horno a 180 grados con calor arriba y abajo. Extendemos la masa con un grosor de aproximadamente cuatro milímetros y cubrimos las manzanas con la masa, remetiendo los bordes hacia dentro de la cazuela. Cocemos durante 25 minutos hasta que la pasta esté dorada. Dejamos templar ligeramente y le damos la vuelta para una bandeja.
