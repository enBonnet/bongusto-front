historia: La historia del guacamole en México se remonta a la época de los aztecas, quienes recolectaban aguacates para preparar un mole, de ahí su nombre en náhuatl “ahuacamolli” que viene de ahuacatl (aguacate) y molli (mole), sin embargo, con la conquista y la llegada de los españoles a América, el aguacate se volvió un alimento escaso, exclusivo y muy buscado pues se decía que su textura y sabor eran muy exóticos. Con el tiempo, el guacamole se convirtió en una preparación típica de todo México que ha trascendido fronteras, pues su elaboración es muy sencilla, ya que sólo debes mezclar el aguacate con chiles verdes, sal y ajo, aunque hay que tener cuidado para que no se oxide y pierda su sabor.
ingredientes: |-
  ### 8 porciones:
  - ½ taza de ají dulce				
  - Sal y aceite al gusto
  - 1 ají picante					
  - ½ aguacate cortado
  - ¼ taza de cebolla en brunoise		
  - 1 cucharadita de jugo de limón
  - 1 cucharada de cilantro en hache
preparacion: "- Mezcle todos los ingredientes y mantenga en la nevera hasta el momento de utilizarlo."
