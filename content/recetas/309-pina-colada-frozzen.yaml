historia: El Caribe Hilton Hotel, ubicado en la capital boricua San Juan afirma que Ramón "Monchito" Marrero creó la Piña Colada en 1954 mientras era cantinero en el hotel. Según este relato, el Sr. Marrero finalmente se decidió por la receta de la Piña Colada, que sintió que capturó la verdadera naturaleza y esencia de Puerto Rico. El hotel recibió una proclamación en 2004 por la gobernadora de Puerto Rico, Sila Calderón, celebrando el 50 aniversario de la bebida.
ingredientes: |-
  - Copa Huracán o en la piña
  - Azúcar
  - Jugo de Piña
  - crema de coco
  - Ron Blanco
  - Hielo Picado
  - **Decoración: **
  - Trozos de piña
  - Sombrillas
  - Pitillos
preparacion: |-
  **En el vaso de la licuadora, agregar:**
  - 4 onzas de jugo de piña 
  - 3 o 4 medidas de azucar
  - 4 onzas de crema de coco
  - 1 ½ onza o 2 de ron blanco
  - Se procede a procesar (licuar)
  - La cantidad de hielo a ser usado, es la misma capacidad de la copa a ser usada. 
  - Agregar el hielo lentamente, mientras se estan procesando los ingredientes y cuando ya tenga la consistencia de frozzen dejar de agregar hielo.
  - Servir y decorar a gusto. 
  - **NOTA: **Generalmente las cremas de coco comerciales son muy dulces, por esa razón utilizamos poca azucar, pero si la crema de coco que se utilizara es sin azucar podemos complementar agregando más azucar o en su defecto leche condensada.
