titulo: Whisky en las Rocas
id: 295
descripcion: Un cóctel on the rocks (aunque también es cada vez más común oírlo en castellano «en las rocas») se sirve con cubos de hielo.
publico: true
categorias:
  - maridaje
photo:
  url: https://res.cloudinary.com/enbonnet/image/upload/v1635604402/iwuwau1dabcf0kixrzd2.png
