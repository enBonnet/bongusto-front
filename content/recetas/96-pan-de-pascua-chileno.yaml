historia: |-
  Se dice que proviene de Alemania o Italia, donde se elabora con levadura y mazapán. Luego se agregan las almendras, frutas secas y nueces, para recordar el lugar donde nació Jesús en donde estos frutos son abundantes. A su llegada a Chile, se generó el llamado «pan de Pascua criollo», el cual cambió las frutas secas por frutas cristalizadas, y el bizcocho cambió a uno de color más oscuro.

  Este pan es una de las muchas variedades de este tipo de alimento navideño, entre las que destacan el Christmas pudding inglés, el pandoro y el panettone italianos, y el Stollen alemán.

  Se suele consumir acompañado de una bebida tradicional llamada cola de mono.
ingredientes: |-
  ### 8 Porciones:
  - 250 gramos de pasas				
  - ½ cucharadita de sal
  - 250 gramos de nueces			
  - 3 cucharadas de ron
  - 250 gramos de almendras			
  - Ralladura de 1 limón
  - 250 gramos de maní tostado sin sal		
  - 500 gramos de azúcar flor
  - 500 gramos de frutas confitadas, optativo, pueden pasar la fruta por el food processor y dejarla bien chiquita si desean o reemplazarla por naranja confitada por ejemplo
  - 1 cucharadita de canela en polvo.		
  - 3 cucharaditas de polvos de hornear cernido
  - 1 cucharadita de nuez moscada en polvo	
  - 6 huevos a temperatura ambiente
  - 1 cucharadita de clavos de olor en polvo
  - 500 gramos de mantequilla sin sal a temperatura ambiente
  - 500 gramos de manjar (en Chile compro la bolsa de manjar Soprole), este año use La Lechera en tarro y quedo de muy lindo color
  - 1 kilo o 1000 gramos de harina sin polvos de hornear cernida
preparacion: |-
  El día anterior poner a remojar las pasas, nueces, maní, almendras y fruta confitada en el ron con la ralladura de limón y las especies. Revolver bien. Cubrir con plástico de cocina y dejar reposar toda la noche.
  Al día siguiente, batir la mantequilla con el azúcar con la batidora hasta que este cremoso y pálido, unos 5 minutos. Agregar los huevos de a uno incorporar bien, batiendo 1 minuto después de cada huevo.
  Agregar el manjar y batir hasta incorporar, unos 3 minutos. Luego incorporar la harina con los polvos de hornear y la sal (cernido todo junto), mientras se bate a baja velocidad hasta que esté bien mezclado, unos 3 minutos, finalmente agregar a mano con una cuchara de palo o espátula las frutas remojadas, mezclar muy bien, yo divido la masa en dos para que sea más fácil.
  Verter en moldes de pan de pascua enmantequillados o forrados en papel encerado. Hornear a 150 C o 300 F por aproximadamente 2 horas o hasta que estén dorados y al probar con un palito este salga sin migas, si lo tocan no debe hundirse. Dejar reposar 25 min en el molde y desmoldar, dejar enfriar totalmente antes de cortar. Guardar en bolsas plásticas.
  Si quieren que sobresalgan del molde deben llenar 3/4, si lo quiere a ras con el borde del molde llenarlos 2/3 con la masa.
