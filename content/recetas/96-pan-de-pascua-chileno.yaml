titulo: Pan de Pascua Chileno
id: 96
descripcion: El pan de Pascua​ es un alimento que consta de una masa dulce, parecida a un bizcocho, de color oscuro, con jengibre y miel de abeja, a la cual se agrega fruta cristalizada
