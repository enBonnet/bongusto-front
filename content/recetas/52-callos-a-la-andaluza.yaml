historia: Los primeros registros en donde se menciona esta receta datan del siglo XIX y su origen es Andalucía, España. Esta es una de las recetas más famosas hechas a partir de callos.
ingredientes: |-
  ### 8 porciones:
  ### Insumos:
  Insumos:
  - 1 kg. de mondongo limpio y previamente ablandado.			
  - 500 g de garbanzos.
  - 150 g de jamón en cubos.		
  - 1 cebolla grande en Emincé.	
  - 3 tomates Concassé.
  - 4 chorizos en ruedas.			
  - 3 dientes de ajo Majados.	
  - 2 hojas de laurel.
  - 1 ramita de hierbabuena.			
  - 1 Paprika.			
  - ½ litro de vino banco.
  - Aceite C/N.				
  - unas hebras de azafrán o un toque de curcuma	.	
  - ½ cucharadita de comino.
  - Pimienta.				
  - 2 clavos de especia.		
  - sal.
  - 1 rebanada de pan frito.			
  - 3 cdas Aceite Onotado.
preparacion: |-
  Preparación:
  - 1. La víspera (24 horas antes) se pondrán los garbanzos en remojo en agua tibia y sal.
  - 2. El mondongo se limpia y se lava, luego se corta en cuadros de 3x3 o a gusto.
  - 3. Llevar el mondongo al fuego en una cacerola u olla cubiertos de agua fría, cuando empiecen a hervir, escurrirlos, volverlos al fuego cubriéndolos de nuevo con agua fría, al empezar la ebullición, espumarlos y dejarlos que se sigan cociendo lentamente y sin interrupción, sazonarlos con sal, dejar en ebullición hasta que ablande. Se puede usar olla a presión.
  - 4. Levar a cocer los garbanzos hasta que ablande agregar un chorrito de aceite, y sal.
  - 5. En sartén puesta al fuego con aceite, freír el ajo, luego de un momento, y agregar seguidamente el jamón, la cebolla, las hojas de laurel y hierbabuena, al empezar a dorarse, añadir la paprika y el tomate, dejarlo sofreír también e incorporar el vino, que se reducirá a la mitad, una vez reducido, mezclarlo junto con los chorizos, vigilando que no se queden cortos de caldo, cuando falte poco para estar cocido añadir el mondongo ya ablandado, sal pimentar.
  - 6. Cuando comience el hervor agregar el azafrán, el comino, la pimienta, el clavo y una rebanada de pan frita, lo que hará espesar la salsa, al quedar todo reducido a una pasta finísima, se agrega el aceite onotado y caldo de los callos de ser necesario si está muy seco, rectificar de sal y pimienta.
  - 7. Se les mezclan entonces los garbanzos cocidos bien escurridos, se retira el ramillete de hierbas y se deja cocer 10 minutos más, no debe tener exceso de salsa y esta deberá estar ligeramente ligada.
  - 8. Se sirven en una cazuela con tapa, con los chorizos cortados a rodajas encima y unas hojitas de hierbabuena.
