titulo: Callos a la Andaluza
id: 52
descripcion: Los callos a la andaluza también conocidos como Menudo Gitano, son hechos a base de callos (tripas de animales). Suelen prepararse con garbanzos y por esto también se denominan “Callos con Garbanzo”
publico: true
categorias:
  - principal
