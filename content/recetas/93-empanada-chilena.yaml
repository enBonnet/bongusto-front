historia: |-
  Muchas culturas alrededor del mundo cuentan con preparaciones de masa rellena con carne o verduras, pero el origen de las empanadas que hoy conocemos se situaría en el Medio Oriente. Cuentan los que saben, que de allí llegaron a España durante la Edad Media. En donde reciben el nombre de “empanadas”, porque entre la carne se “empana”, o se cubre con pan. Desde allí se extendieron por América durante la época de la conquista española y se arraigaron tan profundamente que hoy forman parte de la identidad culinaria de muchos países americanos. Tanto es así que si le preguntas a un sudamericano “¿de qué país son las empanadas?”, sin duda te dirá del suyo.
   Empanada de Pino chilena. Primero que todo, ¿por qué de pino, si no contiene nada de ese árbol? Su nombre se deriva del término pirru, que es como se le dice en mapudungun a la mezcla de carne picada y cebolla con que se rellena esta empanada.
ingredientes: |-
  ### de 8 a 10 porciones:
  ### Masa:
  1 Kilo de Harina.					
  Vino blanco
  2 Cucharadas rasas de polvo para hornear.		
  1/2 Lts de Leche
  200 Gramos manteca de cerdo.			
  1 Huevo.
  1 Cucharadita rasa de sal.
  ### Relleno:
  1/2 Kilo de carne de res molida.			
  Sal
  1 kilo de Cebollas.					
  Ají color (páprika).
  1 vaso vino blanco.					
  Aceitunas (olivas).
  5 Cucharadas de aceite				
  Pasas (uvas secas dulces) (optativo).
  4 Huevos cocidos (duros), trazaditos
  Aliño completo.(ají dulce, color , comino y cubito de carne)
preparacion: |-
  Masa:
  Poner la harina mezclada con sal y con el polvo de hornear en una superficie para amasar.  Hacer un círculo con la harina y poner en el centro la manteca tibia y previamente derretida en sartén, agregar un huevo y la leche paulatinamente para comenzar a mezclar suavemente con las manos hasta lograr una masa más homogénea, así dejar reposar unos minutos para luego comenzar a amasar, Si la consistencia es demasiado seca se continúa suavizando con leche, y si le hemos puesto demasiada leche podemos poner más harina.
   Luego de amasar sacamos trozos de masa y hacemos esferas para volver a amasar y hacer discos de masa (hasta 25 cms. de diámetro).
  Relleno: 
  Picar la cebolla en brunoise y freírla a fuego medio durante 20 minutos revolviendo e Incorporando el vino., luego salpimentar al gusto y agregar los condimentos y la carne para dejar en cocción a fuego medio hasta que la carne esté apenas cocida (5 a 7 minutos aprox). Luego en cada disco de masa poner un poco de relleno escurrido (sacar un poco el líquido), una aceituna, un trozo de huevo y dos pasas. Al cerrar el disco aconsejo pasar una pincelada de agua en la juntura, así evitamos se abra.  Luego de cerrar la empanada en la forma que se desee le damos una pincelada encima con un poco de huevo batido crudo que preparamos, exclusivamente para eso. Engrasamos una placa y enharinamos y llevamos al horno a 200°C hasta dorar.
