historia: |-
  Los postres tradicionales venezolanos son un deleite, tanto por su sabor como por la historia que los acompaña. La mayoría, como la gastronomía criolla en general, tiene influencias de culturas extranjeras debido a la gran cantidad de inmigrantes que llegaron a Venezuela en el siglo XX, además de los colonizadores españoles.

  Uno de los postres sobre el que existen dudas en cuanto a su procedencia es el popular negro en camisa, especie de bizcocho de chocolate bañado con una crema inglesa. Según la mayoría de los recetarios, es de origen venezolano, específicamente de la cocina mantuana. Sin embargo, otra sería la historia.

  Explica Miro Popic, reconocido investigador de la cultura culinaria criolla, que este dulce no fue inventado en la pequeña Venecia, sino, más bien, en Francia o Italia. Según el autor, esta última opción suena más factible, en vista de que en la Grande Enciclopedia Illustrata della Gastronomía, recetario de 2007, hay un postre con orígenes austríacos que lleva el nombre de “negro in camicia”, lo que en su traducción al castellano arroja el mismo título conocido.
ingredientes: |-
  ### 8 Porciones:
  ### Insumos:
  - 300 grs. de chocolate en polvo (semi amargo),	
  - 300 grs. de mantequilla,				
  - 300 grs. de azúcar,					
   - ½ taza de Leche / agua,
  - ¾ de taza de harina leudante,
  - 6 huevos.
  #### Crema Inglesa Ingredientes:
  - 1 Lt de leche,				
  - Azúcar,
  - 6 yemas de huevo,			
  - 1 ramita de vainilla o esencia de vainilla.
preparacion: |-
  ### Preparación de Biscocho:
  - a.	En un envase de cobre o acero inoxidable colocar ½ taza de leche en baño maría, disolver el chocolate, y agregar la mantequilla derretida, moviendo constantemente, agregar la azúcar sin dejar de remover. Es importante no dejar hervir el chocolate para que se mantenga su aroma, debe darse tiempo, déjese hechizar por el chocolate, agregue las yemas de los huevos y continué removiendo enérgicamente.
  - b.	Agregue la harina cernida. Levante las claras a punto de nieve e incorpore batiendo con cuidado en forma envolvente. Hornee a 350º en un molde alto hasta que introduzca un palillo en el medio y salga limpio.

  ### Preparación Crema Inglesa:
  - a.	Caliente la leche y agregue el azúcar y la vainilla, debe abrir la vaina cuidadosamente y sacar solo las semillitas. Aparte bata enérgicamente las yemas de huevo y agregue  la leche, debe remover hasta que suelte el hervor, bajar el fuego y dejar espesar ligeramente, luego apague y deje reposar.
  - b.	Aparte desmolde el bizcocho, que debe quedar negrísimo y esponjoso, vierta la crema inglesa sobre él y déjelo que la absorba. Es importante que el envase donde lo desmolde sea convenientemente alto. Este postre puede comerlo tibio o frío, siempre será un halago a su paladar.
