historia: El hervido de carne ó gallina, se acostumbra a comer en Caracas desde mucho antes del siglo XVIII, se preparaba esta sopa para comer antes del plato fuerte, en épocas de la colonia se presentaba casi diariamente, se hacía primero un caldo con la carne ó el ave, y en esta base se añadían los tubérculos, verduras y aliños, hasta estar blandos, se le agregaba el "sofrito" y el "compuesto", para darle sabor y aroma, entonces se servía el caldo en el plato y las verduras y tubérculos en una bandeja, y las presas del ave ó los trozos de carne en otra, para que el comensal tomara la ración de verduras y carnes de su preferencia, esto representaba el preámbulo al plato fuerte.
ingredientes: |-
  ### Ingredientes para 8 personas 
  - 1 gallina de 2 a 3 kg 
  - 1 limón cortado en dos 
  - 6 litros de agua 
  - 2 ajoporros grandes cortados en dos 
  - 3 cebollas medianas cortadas en dos 
  - 4 o 5 jojotos cortados en trozos medianos 
  - 4 tazas de papas cortadas en cuadritos de 2 centímetros 
  - 10 dientes de ajo majados 
  - 2 cucharadas de sal 
  - ½ cucharadita de pimienta blanca recién molida 
  - 4 cucharadas de mantequilla 
  - 2 ramitas de cilantro 
  - l ramita de yerbabuena
preparacion: |-
  Se limpia muy bien la gallina, quitándole los excesos de grasa, las vísceras y la piel del pescuezo, Se frota con el limón.
  Se coloca entera en una olla de presión, con el agua, el ajoporro y la cebolla. Se cocina a fuego alto hasta que hierva. Se baja a fuego medio y se deja cocinar hasta que ablande (unos 50 minutos). Se retira del fuego y se deja enfriar durante un tiempo (o se enfría con agua de chorro) para abrir la olla sin peligro. Se cuela el caldo y se desechan el ajoporroyla cebolla. 
  Cuando se enfríe la gallina, se le quita la piel y se corta la carne en presas (o en trozos pequeños). En una olla grande se vierte el caldo donde se cocinó la gallina y se le agrega agua hasta completar unas 11 tazas. 
  Se añade el jojoto, las papas, el ajo, la sal y la pimienta y se cocina a fuego alto hasta que hierva. Se baja a fuego medio y se deja cocinar hasta que la papa ablande. 
  Se agregan la gallina y la mantequilla y se deja cocinar por 15 minutos más, Se agregan el cilantro y la yerbabuena. 
  Después de unos 4 minutos, se retira la olla del fuego y se eliminan el cilantro y la yerbabuena.
