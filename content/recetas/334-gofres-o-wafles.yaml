historia: |-
  Haciendo un poco de historia, pareciera ser que esta deliciosa preparación no es tan moderna como se cree, y es que los waffles o “gofres”, como también se les conoce en otras partes del mundo, son de origen belga, pero fue la cultura norteamericana la que los popularizó a nivel mundial, gracias a los colonos que ahí llegaron proveniente de Países Bajos.
  El término 'waffle' y 'wafers' -esta última que significa oblea-, provienen del alemán antiguo 'Wafel', la cual está relacionada con las palabras tejido o panal de abeja, mismo que podría ser uno de los precursores del waflle como lo conocemos ahora en su versión cuadriculada. Durante la época medieval, el wafel alemán se convirtió en lo que se conocería como el gaufre francés, que con el paso del tiempo fue adquiriendo popularidad en Europa donde también se le conoce como gofre.
ingredientes: |-
  **PARA 4 PERSONAS** 
  - 2 tazas Harina 
  - 1/4 taza Azúcar 
  - 1 cucharadita Polvo para hornear 
  - 1 cucharadita Sal 
  - 1 ½ tazas Leche 
  - 1 cucharada Esencia de vainilla 
  - 2 yemas 
  - 2 claras de huevo batidas a punto de turrón 
  - 8 cucharadas Mantequilla fundida
preparacion: |-
  - Coloca en un tazón la harina, el azúcar, el polvo para hornear y la sal. Reserva.
  - Mezcla en otro tazón las yemas, la vainilla y la leche, incorporar a los ingredientes secos, hasta que se integre todo bien, sin batir o mezclar de más.
  - Añade la preparación anterior la mantequilla y mezclar hasta incorporar.
  - Añade de forma envolvente las claras a punto de nieve.
  - Dejar reposar en la nevera por lo menos una hora.
  - Disponemos en una waflera ya caliente y aceitada, una medida de la mezcla y tapamos, dependiendo de la waflera, la cocción podría durar de 7 a 10 minutos, cuando estén doradas están listas.
  - Acompañar con fresas, duraznos y miel.
