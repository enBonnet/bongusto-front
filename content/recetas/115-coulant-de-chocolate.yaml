historia: |-
  Un bizcocho que, al partirlo provocamos una erupción de chocolate derretido… Absolutamente irresistible a los sentidos. Ese era el objetivo que buscaba el chef francés Michel Bras cuando creó el coulant de chocolate. Fue en los años 80, durante un viaje familiar de esquí, cuando lo llegó la inspiración al cocinero galo, que permitió que creara uno de los postres más internacionales y exitosos de la historia.
  Pero ¿cómo fue ese proceso de creación?  Durante esa escapada a la nieve, hizo muy mal tiempo, y todo el grupo tuvo que volver a la cabaña donde se alojaban. Reunidos a cubierto y resguardados del frío, tomaron chocolate a la taza. Michel decidió recrear ese momento en un postre: un irresistible chocolate resguardado en el interior de un bizcocho y que fluyera de su interior. La creación de perfeccionó posteriormente haciendo pruebas y más pruebas, hasta conseguir un bizcocho capaz de atesorar en su interior chocolate fundido.
  El nombre elegido fue coulant, que deriva directamente de la característica lingüísticas del verbo »couler» que a su traducción significa fluido, derretido. Pero no es un nombre tan internacional como el propio postre, ya que en algunos países adopta otras nomenclaturas: en Argentina se llama volcán de chocolate, y en Italia es conocido como soffiato.
ingredientes: |-
  ### Ingredientes para 6 coulant de chocolate
  - 250 gr. Chocolate negro			
  - 250 gr. Mantequilla.
  - 5 huevos enteros.
  - 5 gr. de levadura.				
  - 25 gr. Cacao negro.
  - 1 cucharada sopera de café ya hecho.
  ### Para la decoración
  - Almendra cruda laminada.	
  - Grosellas o cerecitas			
  - Menta hojas
preparacion: |-
  Lo primero que hacemos es cortar el chocolate negro en trocitos, colocarlo en un bol y fundirlo al baño maría junto con la mantequilla, removemos con una cuchara, y cuando el chocolate se derrita, lo apartamos del fuego y añadimos los huevos, el cacao, la levadura y el café, lo trituramos todo con un túrmix hasta que se hallan incorporado todos los ingredientes, la masa resultante será bastante espesa.
  Lo tapamos con papel film y lo metemos en la nevera hasta que esté muy frio.
  Disponemos unos moldes de silicona, en este caso son cuadrados de 4 cm. y medio.
  Sacamos el chocolate de la nevera, veréis que se ha quedado una masa bastante dura, no os preocupéis, no lo habéis hecho mal, es así como debe de quedar.
  Con la ayuda de una cuchara llenamos la tercera parte de los moldes, o sea un poco más de la mitad porque luego nos va a subir, aplastamos ligeramente con la cuchara para que no queden huecos en los moldes. Lo cocemos en el horno a 200º durante 8 min.
  Montaje y decoración: Esperamos unos 5 min. Para desmoldar los coulant y ya podemos servir, decorado al gusto de cada uno, en este caso con grosellas, almendra laminada y menta. ¡¡También lo podéis acompañar de helado, el contraste del chocolate caliente con el helado es brutal!!
