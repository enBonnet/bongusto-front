historia: Francia celebra La Chandeleur (la Candelaria por nuestras tierras) donde lo tradicional es comer crêpes. Sin embargo, en la Provenza la tradición es otra, allí lo tradicional es comer navettes, una especie de suave bizcocho con forma de barquita, con textura crujiente por fuera, ligeramente azucarados y con un delicioso y sutil aroma a flor de azahar. Y es, sin duda alguna, uno de los dulces más tradicionales de Marsella ya que fue allí donde nacieron en 1782.
ingredientes: |-
  - 190 g de harina
  - 75 g de azúcar glass
  - 1 pizca de sal
  - 20 g de mantequilla a temperatura ambiente
  - 1 huevo
  - 1 y ½ cucharaditas de agua de azahar
  - 1 cucharada de polvo de hornear
preparacion: |-
  - Tamizar en un bol la harina, el azúcar, la sal y la levadura.
  - Batir ligeramente el huevo y añadírselo junto al resto de los ingredientes. Mezclar bien y amasar hasta conseguir una bola donde todos los ingredientes estén perfectamente integrados.
  - Envolver en film plástico y dejar reposar en la nevera durante media hora.
  - Dividir la bola en 4 partes y estirar cada parte en forma de cilindro de unos 2cm de diámetro y unos 21cm de largo. 
  - Cortar en tres partes cada cilindro y afinar las puntas rodándolos con las manos.
  - Con un cuchillo afilado pegar un corte profundo en el medio de cilindro, sin llegar a los extremos, y abrirlo con los dedos hacia los lados dándoles su característica forma de barquita. 
  - Colocar en una bandeja cubierta con papel de horno y meter de nuevo en la nevera para que repose durante una hora.
  - Precalentar el horno a 200ºC, con calor de arriba-abajo.
  - Hornear durante unos 15 minutos hasta que veáis que la superficie está ligeramente dorada, sacar y dejar enfriar sobre una rejilla.
  - Servir acompañado con el helado de su gusto, coronando con un sirop, al gusto.
