titulo: Papas Douphine
id: 274
descripcion: |-
  Las papas dauphines son una especie de bombitas o profiteroles de papa, que se hacen 
  con una base de puré de papas mezclado con pasta choux, la misma masa bomba que 
  se usa para hacer profiteroles.
