historia: |-
  Mucho se discute acerca del origen y la forma de preparar las "papas a la Dauphine" o "papas dauphines". Algunos dicen que esta receta se le sirvió por primera vez a la esposa del Delfin de Francia (el heredero al trono), aunque esto no está documentado. 
  Lo más probable es que lleve el nombre de la región montañosa de Dauphiné, próxima a la frontera entre Francia e Italia, en donde las preparan desde hace más de un siglo.
ingredientes: |-
  4 raciones

  - 500 gr puré de papa
  - 250 cc agua
  - 1 cdita sal
  - 100 gr manteca Vegetal o mantequilla o margarina
  - 150 gr harina todo uso
  - 3 huevos
  - Aceite para freír
preparacion: |-
  - Poner el agua, la sal y la manteca en una ollita. Una vez que llega hervor agregar de golpe la harina y con un batidor, espátula o cuchara de madera revolver sin parar hasta que la masa despega por completo de las paredes de la ollita. Bajar la temperatura y agregar de a uno los huevos. Al principio se corta, pero es batir con energía hasta lograr unir.
  - Debe quedar lisita. Se puede hacer con batidora, pero debe ser con buena potencia para no quemarla. Agregar al puré de papas unir. El mío al estar frío costó un poco.
  - Poner en una manga. Cortar la punta como para que tenga el tamaño de un ñoqui. Con mucho cuidado y desde no muy alto ir haciendo presión con la manga e ir tirando en al aceite caliente pequeñas porciones que vamos cortando con un cuchillo. Como tiende a pegarse cada tanto moja el cuchillo para facilitar.
  - Freír hasta dorar. Escurrir y servir con un poco de sal por encima.
