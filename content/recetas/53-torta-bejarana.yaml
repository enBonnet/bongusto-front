historia: |-
  La Torta Bejarana es un ponqué que vendían las hermanas Bejarano en la época de la colonia en Venezuela, para el año 1793.

  Cuenta la historia que en la Caracas del siglo XVIII, marcada por las diferencias de clases sociales, tres hermanas pardas de apellido Bejarano pudieron adquirir los derechos de un blanco con el dinero que obtenían de la venta de una torta.

  La torta se hizo tan popular y Magdalena, Eduvigis y Belén acumularon tanto dinero que pudieron comprar la Real Cédula, con la cual se adquirían los derechos de los blancos. “Que se tenga a las Bejarano como blancas aunque sean negras” dice el decreto del Rey Carlos IV.Sin embargo, el tratamiento de doñas les fue negado porque “a pesar de ser tenidas por blancas, no son blancas las Bejarano”, decía el Rey.
ingredientes: |-
  ### 8 Porciones:
  ### Insumos:
  - 7 plátanos maduros.				
  - 6 roscas de pan de horno.
  - 50 g de margarina.				
  - 125 g de queso blanco rallado.
  - 2 huevos.					
  - 1/4 taza de agua.
  - 2 cucharaditas de bicarbonato.		
  - 300 g panela de papelón.
  - 1 cucharadita de clavos molidos.		
  - 1 cucharadita de canela.
  - 4 cucharadas de ajonjolí para decorar.
preparacion: |-
  ### Preparación
  - a.	Precalienta el horno a 180 °C. Enmantequillar un molde para torta y espolvorear con el ajonjolí.
  - b.	Hervir el plátano hasta que quede como para hacer puré, pelar y triturar. Luego, tostar el pan de horno y molerlo. Después, preparar un melado con el papelón derretido en el agua. Retirar del fuego y colar.
  - c.	Colocar los plátanos, el melado, la canela, los clavos molidos, el bicarbonato, los huevo, en un bol y con la ayuda de una batidora mezclar hasta que quede una mezcla homogénea. Verter en el molde. Hornear por 45 minutos, aproximadamente. Retire del horno y deje enfría.
