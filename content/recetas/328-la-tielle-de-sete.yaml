historia: Es una especie de empanada rellena de pulpo con salsa de tomate y especias. Siendo el almuerzo tradicional de los pescadores en el mar, se ha convertido en el plato típico de la gastronomía de Sète, ciudad marinera del sur de Francia.
ingredientes: |-
  **Para la masa: **
  - 400 g de harina 
  - 2 cucharadas de aceite de oliva 
  - 50 ml de vino blanco 
  - 1 sobre de levadura de panadería 
  - 1 yema de huevo (para dorarla antes de meterla al horno) 
  - Sal 
  **Para la guarnición: **
  - 1 kg de pulpo (y / o calamar) 
  - 1 kg de tomates concasette
  - 2 cebollas en brunoise
  - 3 dientes de ajo majados
  - Tomillo, 
  - laurel 
  - Cayena en polvo 
  - Aceite de oliva 
  - Sal, 
  - Pimienta
preparacion: |-
  **Preparación de la masa**
  - Mezclar la levadura de panadería en un bol con unas cucharadas de agua tibia y dejar reposar durante 15 minutos. 
  - Tamizar la harina en un bol, agregar la sal, el aceite de oliva, el vino blanco y luego agregar la levadura. 
  - Amasar la masa hasta obtener una bola suave y homogénea que no se pegue a los dedos. (Si la masa está demasiado seca añade agua poco a poco). Deje reposar la masa en el bol cubierto con un paño húmedo durante al menos 1 hora.
  **Relleno**
  - Pre cocinar los pulpos en un caldo de corte (bouquet garni, caldo de pescado, etc.) y luego enjuagarlos con agua fría para poder “pelarlos”: se quitan la piel y las ventosas. (Si los pulpos no son demasiado grandes, podemos dejar la piel que dará un bonito color rojo al cocinarlos). 
  - Cortar la pulpa del pulpo en trozos pequeños.
  - Triturar la pulpa de los tomates. Las cebollas y los ajos y dorarlos unos minutos en un poco de aceite de oliva. Agregue los tomates, la hoja de laurel, el tomillo, la pimienta, el pulpo, la sal y la pimienta y cocine a fuego lento durante 1 hora a fuego lento. La salsa debe reducirse, pero aún estar un poco líquida para humedecer la masa del tielle. Dejar enfriar.
  **Montaje de la tielle**
  - Aceitar 4 moldes de unos 16 cm de diámetro.
  - Corta la masa de pan en cuatro partes, luego divide cada parte en 2/3 y 1/3. (2/3 para la parte inferior y 1/3 para la tapa). Enharinar la superficie de trabajo y extender los fondos en forma redonda (2/3) hasta un espesor de menos de 1 cm, la masa debe desbordar los moldes. Coloca la masa sobre los moldes, dejando que se desborde por los lados. Decora con la preparación de pulpo.
  - Estirar la segunda masa (1/3) para formar la tapa (la masa también debe sobresalir del molde). Diluir un poco de salsa con aceite de oliva y untar los bordes de la masa del fondo con ella. Coloque la masa superior y suelde los bordes presionando entre los dedos. Dejar reposar unos minutos y controlar la soldadura.
  Cepille el tielle con la mezcla de salsa y aceite de oliva y haga muescas cada centímetro en la soldadura. Pincelar con yema de huevo para dorar la masa. Pincha la parte superior del tielle con 2 o 3 cuchillos para expulsar el aire y dejar que la salsa se escape para colorear el tielle con su hermoso color naranja. Hornee a 210/220 C ° durante 30 minutos.
