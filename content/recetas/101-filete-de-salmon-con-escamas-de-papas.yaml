historia: No hay mucha información sobre la historia de este plato, se entiende que es de las nuevas tendecias de la cocina francesa
ingredientes: |-
  ### 4 porciones:
  - 4 filetes de salmón con la piel o de merluza.	
  - 2 yemas de huevos					
  - Sal y pimienta al gusto
  - Mantequilla clarificada
  - 500 gramos papas blancas
preparacion: |-
  - 1. Limpiar los filetes que no le queden espinas
  - 2. Salpimentar, reservar
  - 3. Pelar las papas, darle forma de tubo alargadas, cortar en ruedas finas
  - 4. Colocar las yemas en un recipiente
  - 5. Armar las escamas de papas en los filetes sobre la parte sin piel
  - 6. Incorporar la mantequilla clarificada sobre las escamas de papas
  - 7. Colocar los filetes armados, en el recipiente Con las yemas con las escamas de papas hacia arriba.
  - 8. Cocinar el pescado sobre el lado cubierto por las escamas de papas, en una sartén antiadherente, hasta que esté hecho.
