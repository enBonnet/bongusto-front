historia: |-
  La torta Negra es famosa por elaborarse solo en época decembrina como parte de los festejos navideños, su sabor es maravilloso y mientras más tiempo lleven maceradas las frutas que la componen mejor será su sabor.
  Este dulce tiene referencias extranjeras, particularmente de los países nórdicos europeos, donde suele hacerse con frutas secas maceradas en licor para preservarlas hasta las fiestas 
  decembrinas. Hasta su presentación responde a territorios extranjeros: la cubierta de nevado 
  o azúcar pulverizada que a veces lleva es propia de un clima invernal. También llamada torta de Navidad, en Venezuela ha incorporado sus propios ingredientes: chocolate, clavo de olor y ron. Incluso se han hecho algunas variaciones más tropicales en las que se utilizan mango y piña entre las frutas secas, y merey en lugar de almendras o nueces.
ingredientes: |-
  ### Ingredientes (para 1 torta) 
  - 125 gramos de chocolate o 2 cucharadas de polvo de cacao 
  - 600 gramos de mantequilla 
  - ¼ kg de azúcar moscabada 
  - ¼ kg de azúcar refinada 
  - 12 yemas de huevos 
  - ¾ kg de harina leudante 
  - 2 cucharadas de polvo de hornear 
  - 1 cucharada rasa de clavo en polvo 
  - 1 cucharada rasa de canela en polvo 
  - ¾ kg de frutas secas (maceradas previamente en ron durante 3 meses como mínimo)
  - 125 gramos de higos secos cortaditos 
  - 125 gramos de nueces o avellanas 
  - 125 gramos ciruelas pasas sin semilla y cortaditas 
  - 125 gramos de pasas sin semilla y cortaditas 
  - 2 tazas de ron
preparacion: |-
  1. Se en mantequilla y enharina un molde para torta. 
  2. Se precalienta el horno a 190°C. 
  3. En una olla, se derrite a fuego bajo el chocolate y se reserva. 
  4. En un recipiente aparte, se bate la mantequilla con la azúcar moscabada y la azúcar refinada, hasta que quede una crema. 
  5. Se agregan los huevos uno a uno, y luego la harina, el polvo de hornear y las especias (clavo y canela), sin dejar de batir. Se añaden las frutas secas maceradas, el ron, los higos, las nueces, las ciruelas pasas, las pasas y el chocolate derretido. 
  6. Se vierte la mezcla en el molde y se hornea por 50 minutos, O hasta que, al introducirle una aguja, ésta salga seca.
  NOTA: De no disponer de los frutos macerados con antelación, con un día de anticipación colocar todos los frutos a macerar junto con el licor en una olla y llevar al fuego hasta que comience a hervir, apagar dejar que se enfrié tapado, luego llevar a un recipiente que se pueda tapar hermético, se le agrega más licor y se reserva en refrigeración por lo menos 24 horas.
