historia: En 1981 se realizó una carrera de ciclismo entre las ciudades de Paris y Brest (ciudad ubicada en una punta de la Bretaña Francesa) y constaba de 1.200km. Cuando tuvo lugar la competición, un pastelero aficionado a las bicicletas y el ciclismo elaboró en honor a la carrera un pastel para la ocasión. Hay quien dice que la forma redonda es un homenaje a la rueda de bicicleta (por eso el pastel es en forma de circulo con el centro vacío) otros dicen que expresa el “ir y volver” de las dos ciudades francesas.
ingredientes: |-
  ### De 6 a 8 porciones:
  ### Masa choux:
  ### Ingredientes:
  - 150g de harina	
  - 100 ml de agua	
  - 125ml de leche	
  - 3-4 huevos
  - 90g de margarina	
  - 1 pizca de sal	
  - 10g de azúcar (1 cucharada sopera rasa)
  ### Crema Pastelera:
  ### Ingredientes	
  - 12 cucharadas fécula de Maíz.		
  - 1 taza azúcar
  - 2 taza leche
  - 2 huevo				
  - 1 cucharita de Vainilla
preparacion: |-
  ### PreparaciónMasa choux :
  - 1º)  Ponemos en una olla el agua, la leche, la sal, el azúcar y la mantequilla al fuego hasta que se derrita la mantequilla y rompa a hervir.
  - 2º) Cuando la leche empiece a hervir le agregamos toda la harina de golpe y removemos para que no haga grumos, la sacamos del fuego. Estará muy dura pero hay que moverla enérgicamente hasta que se despegue de las paredes de la olla.
  - 3º) Dejamos enfriar 10 minutos, hasta que esté templada, y le vamos añadiendo los huevos 1 a 1, un poco batidos y mezclamos bien. No añadiremos el siguiente huevo hasta que el anterior esté bien integrado. La masa dará la impresión que se ha cortado, pero seguimos moviendo y se unificará.
  - Igual no hay que ponerle todos los huevos, después de 2º le iremos poniendo el siguiente poco a poco... la masa estará en su punto cuando la levantarla con una espátula se forma un "pico de pato"
  - La ponemos en una manga pastelera y hacemos los dulces que más nos gusten.
  - Se hornea con el horno precalentado a 180ºC durante 15 minutos aproximadamente. Pasado ese tiempo se apaga el horno y se dejan enfriar dentro otros 10 minutos para que se sequen, con la puerta entreabierta.
  - Dejamos enfriar y rellenamos con nata montada, crema chantillí o crema pastelera. Coronadas con caramelo casero, azúcar glas o chocolate.
  ### Pasos Para la Crema Pastelera:	
  - Batir el azúcar con el huevo hasta lograr que quede cremoso y lentamente sin dejar de batir agregamos la fécula para que no se formen grumos hacerlo despacio batiendo hasta integrarla.
  - Poner la leche al fuego y cuando este por romper en hervor agregamos la mezcla ya batida y revolvemos mientras la volcamos.
  - Revolvemos hasta formar la crema entre espesa y no tanto...retiramos dejamos reposar y lista.
  ### Decoración:
  - caramelo casero		
  - azúcar glas		
  - almendra laminada o en trocitos
  - chocolate negro
