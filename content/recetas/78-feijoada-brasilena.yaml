historia: |-
  Los portugueses llevaron recetas para Brasil, con ingredientes como la oreja, el morro, el rabo y la lengua de cerdo; por lo que se extendió el uso de este animal en las dietas. En el libro História da Alimentação no Brasil (Historia de la alimentación en Brasil), Luís da Cámara Cascudo escribe sobre los orígenes de la feijoada.
  Muchos autores concuerdan en decir que la feijoada tuvo su origen cuando luego de los festines que se daban los dueños de las plantaciones, los esclavos negros recogían las sobras para mezclarlas con frijoles negros, haciendo un nuevo guiso.
ingredientes: |-
  ### 8 Porciones:
  - 2 tazas de arroz 4 naranjas maduras, para guarnición	
  - Aceite de oliva
  - 500 gms porotos negros (caraotas)				
  - Sal y pimienta al gusto
  - 250 gms carne seca						
  - 2 dientes ajos majados
  - 250 gms costilla de cerdo					
  - 2 cebollas en brunoise
  - 1 lengua de res o 2 de cerdo					
  - 4 tomates maduros
  - 150 gms longaniza (chorizo ahumado o morcilla)	
  - 250 gms panceta ahumada (tocineta)
preparacion: |-
  - 1.	Colocar en remojo toda la noche los porotos y por otro lado la carne seca, enjuagar y escurrir, pasar la carne seca a una olla,, añadir la lengua, las  costillas de cerdo, la longaniza, la panceta, cubrir con agua fría y llevar a ebullición a fuego vivo
  - 2.	Espumar el guiso, bajar el fuego, tapar dejar cocinar durante dos horas, retirar cada pieza de carne o embutido cuándo esté a punto, añadiendo más agua si fuera necesario. Reservar en un recipiente, cubiertas con caldo
  - 3.	Ojo. Al mismo tiempo poner a cocinar los porotos a fuego suave por dos horas, o hasta que ablanden, luego   escurrir los porotos, reservando  el caldo, guardar ambos  por separados
  - 4.	Saltear las cebollas, el ajo con aceite, añadir los tomates, sal y pimenta dejar cocer por 15 minutos, incorporar la mitad de los porotos, prensarlos con tenedor. Agregar el resto de los porotos con una taza de líquido reservado
  - 5.	Para preparar el arroz; en una olla calentar aceite, ajo, luego añadir  11/2 tazas de agua por cada taza de arroz, al romper el hervor, incorporar el arroz crudo, sazonar, tapar y dejar cocinar
  - 6.	Pelar la lengua, cortar las carnes y los embutidos  en trozos. En un plato, servir los porotos, el arroz, las carnes y los embutidos, y en otro plato servir las naranjas peladas en ruedas finas.
  - Nota: Los porotos deben quedar semi secos como si fueran unas caraotas refritas
