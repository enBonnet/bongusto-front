historia: Los orígenes del B-52 no están bien documentados, pero una afirmación es que el B-52 fue inventado por Peter Fich, jefe de camareros en el Hotel Banff Springs en Banff, Canadá. Fich nombró todas sus nuevas bebidas por bandas, álbumes y canciones favoritas, y nombró la bebida por la banda del mismo nombre, los B-52's que a su vez tomaron su nombre del bombardero estadounidense B-52 Stratofortress.
ingredientes: |-
  - vaso shutter o caballito
  - Licor de Café
  - Bailey's y/o Ponche crema
  - Grand Marnier o Cointreau o Triple “C” o Licor de naranja
  - Yesquero
  - Pitillo
preparacion: |-
  - 1ro servir en el vaso 1/3 licor de café
  - 2do servir 1/3 de Bailey's utilizando el canto de la cucharilla de bar, para evitar que se mezclen
  - 3ro servir 1/3 de Grand Marnier utilizando el canto de la cucharilla de bar, para evitar que se mezclen
  - 4to encender, dejar que se consumo un poco el alcohol y apagar
  - 5to consumir usando un pitillo el cual se usa como removedor antes de degustar
