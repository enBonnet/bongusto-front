historia: |-
  A pesar de que la yuca envuelve como «una chaqueta» al relleno y de que los franceses estuvieron presentes en la historia de América latina.
  Lo cierto es que Panamá y Colombia comparten una tradición que seguramente procede de la época (año 1821) en la que ambos países fueron uno solo.
  Colombia y Panamá se separaron con el tiempo, pero la tradición culinaria que compartieron persiste hasta nuestros días.
  Hay quien llama a este plato «caribañola» y algunos asocian esta denominación con su fama en el Caribe y una posible procedencia española.
  O la unión de sus dos orígenes en una sola palabra.
  Sin embargo, la popularidad de este plato en estos dos países que estuvieron unidos, hace pensar que procede del siglo XIX.
  Aunque también podría tratarse de una tradición compartida por la vecindad geográfica de ambos (ya que solo están separados por el istmo de Panamá).
ingredientes: |-
  (15 porciones)
  •	1 lkg de yuca
  •	½ kg de carne Molida
  •	1 cucharadita de sal
  •	½ taza de aceite
  •	½ taza de cebolla en brunoise 
  •	2 dientes de ajo majados
  •	½ taza pimentón o ají dulce en brunoise 
  •	½ cucharadita de ají chombo (picante)
  •	2 cucharaditas de puré de tomate
  •	¼ cucharadita de comino molido
  •	Sal y Pimienta al gusto
preparacion: |-
  •	Pelar y cortar la yuca. Córtela en trozos y póngala a cocinar en una cacerola con agua hirviendo por 20 minutos. Luego pásela por un colador retirando el agua.
  •	Triture la yuca, añada sal y 1 cucharada de aceite. Mezcle bien hasta obtener una masa suave.
  •	En una sartén caliente aceite y sofría la cebolla, ajos y pimentón. Luego incorpore el ají chombo, el comino y la carne molida. Remover bien para que se cocine la carne.
  •	Añadir el puré de tomates, sal y pimienta. Dejar cocinar por unos 5 minutos y retirar del fuego.
  •	Tomar una parte de la masa de yuca y formar una tortilla a la que se le agrega el relleno preparado y se cierra con la misma masa. Debe darle forma ovalada que es la de caramiñola.
  •	En una sartén con suficiente aceite bien caliente, fría las caramiñolas hasta que se doren.
  •	Colóquelas sobre una hoja de papel para que retire el exceso de grasa. ¡Buen provecho!
  Nota: El relleno también puede ser de pollo o queso
