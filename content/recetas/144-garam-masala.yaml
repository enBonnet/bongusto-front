historia: |-
  Garam masala es una mezcla de especias secas que se utiliza en toda la India, sobre todo en el norte, pero también en otras partes de Asia. En la India, masala se refiere a cualquier tipo de especias, mientras garam significa calor, por lo que este nombre significa "especias calientes". A pesar del nombre, el garam masala no es especialmente picante, y el "caliente" se cree que se refiere al hecho de que las especias se tuestan antes de la molienda.
  Al igual que otros ingredientes esenciales en la cocina de la India, el garam masala se ha utilizado a lo largo de los siglos y adoptado por otras gastronomías vecinas como por ejemplo en el sureste asiático, aunque cada cual lo ha ido modificado según sus gustos y costumbres, siendo la composición variable y muy personal.
ingredientes: |-
  - 2 cucharadas de cilantro			
  - 1 o 2 cucharadita de paprika
  - 1 cucharada de comino 			
  - ½ cucharadita de cebolla en polvo
  - 1 Pieza de anís estrellado 			
  - ½ cucharadita de ajo en polvo
  - 1 rama de canela 				
  - 1 cucharadita de cayena
  - 4 clavos de olor 				
  - 1 cucharadita de fenogreco
  - 6 vainas de cardamomo 			
  - 1 hoja de laurel
  - 1 cucharada de pimienta negra 		
  - 1 cucharadita de nuez moscada
  - 1 trozo de macis
preparacion: |-
  1. Colocar todas las especias que estén en semillas, vainas, ramas… en una sartén sin engrasar, tuéstalas a fuego moderado, moviéndolas de vez en cuando, hasta que desprendan su aroma.
  2. Retíralas y viértelas en el recipiente manual o eléctrico que utilices para moler las especias, añade las que sean en polvo, como el ajo, la cebolla y la paprika. Tritura hasta que el Garam masala sea una mezcla de especias fina y homogénea.
  3. Pásala a un tarro con tapa hermética, está lista para condimentar tus platos.
