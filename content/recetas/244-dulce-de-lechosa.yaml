historia: |-
  Aunque cada vez más se incorpora la torta negra, especialmente como merienda para ofrecer a las visitas, el dulce de lechosa sigue siendo en Venezuela, el gran postre tradicional de la Navidad. 
  Sobresaliente entre las frutas de consumo local por las virtudes curativas a las que está asociada, la lechosa se prepara como dulce desde tiempos remotos y recurriendo a las, técnicas más variadas, como secar la fruta verde colocándola sobre láminas de zinc bajo los rayos del sol, dejarla toda la noche bajo el sereno, acaramelarla para asegurar su conservación 
  por largo tiempo o someterla a procesos industriales exitosos que han logrado garantizar sus 
  sabores tradicionales con especias y hojas de higo. Su presentación variable, aunque predominan las tiras largas o el corte en trocitos, que es como la ofrecemos en este recetario, Su color puede ser claro u oscuro, dependiendo del uso de azúcar o papelón.
ingredientes: |-
  ### Ingredientes (para 15 personas) 
  - 2 kg de lechosa verde, pelada, sin semillas y cortada en tajada muy delgadas 
  - Agua 
  - ½ cucharada de bicarbonato de sodio 
  - 2 kg de papelón (o azúcar) 
  - 20 clavos de olor
preparacion: |-
  1. En una olla grande se calientan a fuego alto las tajadas de lechosa con 12 tazas de agua y el bicarbonato. Después que hierva, se deja cocinar por unos 3 minutos. Se retira del fuego y se cuela. Se lavan muy bien con agua corriente y se reservan.
  2. En otra olla grande, con 15 tazas de agua, se disuelve a fuego alto el papelón. Cuando hierva, se deja cocinar por unos 15 minutos, revolviendo con frecuencia. 
  3. Cuando tenga una consistencia espesa, se retira del fuego, se pasa por un colador de tela y se pone en una olla limpia. 
  4. Se le añade la lechosa y los clavos de olor, Se cocina todo destapado y a fuego alto, por 1 ½ horas, hasta que el almíbar espese. Las tajadas de lechosa deben quedar brillantes. 
  5. Se retira del fuego, se eliminan los clavos y se deja enfriar la lechosa, antes de refrigerar.
