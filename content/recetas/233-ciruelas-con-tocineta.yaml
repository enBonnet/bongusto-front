historia: También se les conoce como ojo de buey, y son otro clásico entre los pasapalos venezolanos. A pesar de su curioso aspecto, y de ser toda una amenaza para las dietas y la cultura light, es muy común en las fiestas y banquetes que los mesoneros traigan, entre sus bandejas repletas de bocadillos diversos, una oscura y dulce ciruela envuelta-en un manto de tocineta previamente dorada en aceite. También se prepara un pasapalo muy parecido con trozos de lomito envueltos en tiras de tocineta. El ojo de buey es una receta sencilla, que se ha convertido en parte obligada de los preparativos para esas reuniones sociales en donde lo práctico, rápido y gustoso es siempre la mejor opción.
ingredientes: |-
  ### Ingredientes (para 50 personas) 
  - ½ kg de ciruelas pasas sin semilla 
  - 400 gramos de tocineta rebanada en tiras 
  - Papel absorbente
preparacion: |-
  1. En un recipiente, se remojan las ciruelas pasas durante 2 horas en agua caliente. 
  2. En una sartén, se saltean las tocineras (sin aceite) hasta que doren un poco, pero sin que lleguen a tostarse. Se retiran y se colocan sobre papel absorbente para eliminar el exceso de grasa.
  3. Se enrolla cada ciruela con una tira de tocineta. Se ajusta con un palillo. 
  4. ### Sugerencia 
  - Como se trata de un plato caliente, se recomienda prepararlo justo antes de servir para que no pierda sus propiedades de sabor y textura. 
  ### Opcional 
  - Las ciruelas pueden sustituirse por dátiles o por queso mozzarella cortado en cuadritos.
