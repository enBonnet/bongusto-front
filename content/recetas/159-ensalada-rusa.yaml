historia: |-
  La ensalada rusa es una de las ensaladas mas populares del mundo, sin embargo, existen muchas variaciones de este platillo ya que su receta original siempre fue considerada un misterio.
  Una de las teorías más divulgadas sobre la ensalada rusa es la de un cocinero belga de origen francés llamado Lucien Olivier. Se cuenta que Olivier emigró a Rusia para abrir su restaurante de alta cocina en Moscú, el Hermitage (o Ermitage) por ahí de 1860 en un edificio al lado de la plaza Trubnaya. En su restaurante, Olivier ofrecía lo mejor de la gastronomía francesa; el negocio triunfó gracias a la aristocracia zarista y a los grandes intelectuales que se reunían allí.
  Dentro de su menú, la estrella era una ensalada originalmente llamada ‘mayonesa de caza’ que después cambió su nombre a salat Olivye o салат Оливье en ruso. La receta de Olivier estaba compuesta por carnes, caviar, lengua de ternera y trufa, además de pepinillos, papas cocidas y aceitunas, todo bien cubierto con una mayonesa que pocos lograr descifrar.
  En 1883, Lucien Olivier murió y llevó consigo el secreto de su plato, ya que nunca escribió la receta y ninguno de sus asistentes vio cómo la preparó. Su restaurante, The Hermitage, finalmente se cerró en 1905. La mayonesa fue imitada a base de mayonesa, aceite de oliva, vinagre de estragón, mostaza y salsa Mogul o Kabul (que podría ser similar a la de soya).
ingredientes: |-
  ### 4 Porciones:
  - 2 ½ kilos de papas, peladas, cocidas y cortadas en cubitos
  - ½ kilo de zanahoria, pelado, cocido y cortado en cubitos
  - 1 lata de petit pois 			
  - 1 lata de maíz tierno
  - 6 tallos de apio, finamente cortados, alrededor de 1 taza
  - 1 o 2 manzanas, cortadas en cubitos
  - 1 taza de cebolla blanca, aproximadamente ½ cebolla, en brunoise
  - Jugo de 1-2 limones			
  - 1 diente de ajo, majado
  - 1 taza de mayonesa casera o comprada
  - 1 cucharada de cilantro, perejil o eneldo, en hache
  - Sal al gusto
preparacion: |-
  1. Mezclar bien todos los ingredientes en una fuente para ensaladas.
  2. Refrigerar hasta que esté listo para servir.
