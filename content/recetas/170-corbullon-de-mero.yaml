historia: |-
  El corbullón de mero es un plato mestizo. Llegó a nuestro territorio con la inmigración corsa de comienzos del siglo XIX, asentada principalmente en Carúpano, que en ese momento constituía una ciudad muy atractiva para el comercio.
  Como su nombre lo indica, esta receta Se prepara con mero, aunque se conocen versiones con pargo. Una de las muestras de crio-llización de este plato es la incorporación de bolitas de masa con ají dulce.
ingredientes: |-
  ### Ingredientes (para 4 personas) 
  ### Pescado 
  - 1 ½ kg de mero de roca, sin piel, espinas ni entrañas, También puede utilizarse pargo 
  ### Adobo 
  - El jugo de un limón 
  - Pimienta negra y sal al gusto 
  ### Sofrito 
  - 3 cucharadas de aceite vegetal 
  - 2 tomates maduros cortados en ruedas gruesas 
  - 1 pimentón rojo en tiritas 
  - 3 dientes de ajo cortaditos 
  - 1 ají dulce en cuadros pequeños 
  - 1 ramillete de tomíllo 
  - 3 hojas de laurel 
  - Sal al gusto 
  ### Cocción 
  - 2 cebolla medianas en ruedas 
  - 50 gramos de aceitunas rellenas de pimentón 
  - 1 taza de vino tinto 
  - 1 copita de jerez (opcional)
  ### Como Hacer las Bolitas de Masa
  ### Ingredientes 
  - 1 taza de harina de maíz precocida 
  - 1 tazas de agua potable a temperatura ambiente 
  - 1 cucharada de mantequilla derretida 
  - 2 cucharaditas de ají dulce cortadito o rallado. 
  - ½ cucharadita de sal
preparacion: |-
  1. Se lava el pescado en agua corriente y se corta en trozos medianos. Se adoba con el jugo de 
  2. limón, la pimienta y la sal, y se deja marinar durante dos horas. 
  3. Se sofríen en aceite durante 10 minutos el tomate, el pimentón, los ajos, el ají y las hojas de tomillo y laurel. Se añade sal al gusto. 
  4. Se agregan las ruedas de cebolla y se saltean hasta que se vuelvan translúcidas. 
  5. Se escurren los trozos de mero y se sofríen, en la misma sartén, hasta que tengan un poco de 
  6. color. 
  7. Se agregan el vino, el jerez y las aceitunas. 
  8. Se agregan las bolitas de masa, 
  9. Se tapa todo y se deja cocer a fuego lento por 10 minutos. 
  ### Opcional 
  - En el momento en que se añade el vino, pueden agregarse papas hervidas y peladas. Hay quienes incluyen alcaparras y un chorrito de aceite de oliva.
  ### Como Hacer las Bolitas de Masa
  ### Preparación 
  1. Se une la harina con la sal.
  2. Se añade el agua poco a poco, mientras se mezcla con los dedos. Se agrega la mantequilla y se amasa todo con la palma de la mano.
  3. Antes de que la mezcla esté totalmente homogénea, se añade el ají y se vuelve a amasar. 
  4. Se deja reposar durante 5 minutos. 
  5. Se divide la masa en porciones pequeñas que quepan en un puño con la palma de las manos (o sobre una superficie lisa) se hacen bolitas de unos 2 cm de diámetro.
