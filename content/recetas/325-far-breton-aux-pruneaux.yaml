historia: |-
  Far Breton es un pastel bastante denso de Bretaña, un primo lejano del flan de hojaldre o clafoutis según la variante. Se llama en bretón farz forn ( farz fourn en Léonard country ) que significa: lejos en el horno. La receta más conocida es la de ciruelas pasas, aunque tradicionalmente el fardo no incluye ninguna.
  Far en latín significa “trigo, maíz, papilla”. Originalmente era una papilla de trigo, luego se prefirió hornear y eventualmente se le agregaron frutos secos como ciruelas pasas o uvas. Por lo tanto, era un postre económico, que hoy se ha convertido en un plato tradicional de Bretaña.
ingredientes: |-
  - ½ litro de leche
  - 75 gr de harina
  - 75 gr de azúcar
  - 3 huevos
  - 20 gr de mantequilla con sal
  - 500 gr de ciruelas pasas
  - 100 ml de ron
  - Pizca de sal
preparacion: |-
  - Ponga las ciruelas en remojo en el ron (para ablandarlas). 
  - Mezcle la harina tamizada con el azúcar y la sal. 
  - Coloque los huevos y mezcle hasta obtener una pasta lista. 
  - Añada leche tibia, poco a poco y mantequilla derretida, mezclar hasta se integre
  - unte el molde con abundante mantequilla derretida. 
  - Distribuya las ciruelas en el fondo e incorpore la mezcla, que no debe estar tan liquida. 
  - Hornee durante 10 minutos a 220° y luego reduzca a 170° para que monte. Al dorar verificar con un palillo si el centro esta cocido y listo. 
  - El interior debe ser blando.
