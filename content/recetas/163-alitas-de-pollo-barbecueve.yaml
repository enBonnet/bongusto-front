historia: |-
  La teoría más aceptada es que las alitas Búfalo, fueron creadas por Teressa Bellissimo, dueña del restaurante Anchor Bar, en la ciudad de Búfalo. Para preparar su salsa de spaghetti, el restaurante utilizaba cuellos de pollo, pero un día, en 1964, recibieron un pedido erróneo donde en lugar de cuellos les entregaron alitas. Para no desperdiciar, los dueños decidieron inventar un aperitivo.
  Teressa cortó cada alita en dos partes, para que los clientes lo pudieran comer con las manos. Después las frió, sin empanizar, y las cubrió con una salsa picante. Decidió servirlas acompañadas de apio y de aderezo de queso azul. Y así fue como nacieron las alitas que conocemos en la actualidad.
ingredientes: |-
  ### 4 raciones
  - 16 alitas					
  - 1 cerveza pequeña
  - 1 cda paprika					
  - Salsa BBQ
  - 1 cda sal de ajo				
  - 1 cda pimienta negra
preparacion: |-
  1. Mezclamos todas las especies con la cerveza.
  2. Marinamos las alitas con la mezcla y metemos al refrigerador por 1 hora.
  3. Ponemos las alitas sobre papel aluminio y metemos al horno por 20 minutos a 180°.    Sacamos las alitas y las bañamos en salsa BBQ y las volvemos a introducir al horno por 15 minutos más.
  4. Las sacamos y les agregamos un poco más de salsa BBQ.     Listo!!!
