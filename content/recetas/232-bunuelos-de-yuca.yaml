historia: |-
  La yuca representa uno de los más importantes cultivos de las etnias indígenas que comparten la nación venezolana, y es el componente básico de uno de nuestros más originales "panes": el casabe. Igualmente la encontramos, en otra variedad de uso, como acompañante de platos fuertes (especialmente de la carne a la parrilla), en pastelitos, empanadas o convertida en buñuelos. En general, estos últimos no son otra cosa que un puré de vegetales, a veces con frutas o pescado, que luego se fríen en forma de bolitas. En el caso de los buñuelos de yuca, 
  esta técnica de cocción transforma la textura del ingrediente principal y lo convierte en una masa suave y delicada que se deshace en la boca. Se pueden comer solos o rellenos y bañados con un melao de papelón, sea como acompañante, como postre o como pasapalo.
ingredientes: |-
  ### Ingredientes (para 35 porciones) 
  - 1 kg de yuca sancochada 
  - 3 yemas de huevo batidas 
  - 2 cucharadas de azúcar 
  - 1 cucharadita de sal 
  - 4 tazas de aceite de maíz 
  - Papel absorbente 
  - ½ panela de papelón blanco en trocitos 
  - 1 ¼ tazas de agua 
  - 6 clavos de olor
preparacion: |-
  1. Se le quitan las venas a la yuca y se tritura hasta que tenga la consistencia de una masa. 
  2. Se le agregan las yemas de los huevos, el azúcar y la sal. Se amasa hasta que quede una mezcla homogénea.
  3. Con pequeñas porciones de la mezcla, se hacen bolitas de unos 2 ½ centímetros de diámetro. 
  4. Se fríen en abundante aceite caliente y a fuego alto, hasta que doren. 
  5. Se retiran del aceite y se colocan sobre papel absorbente pava eliminar el exceso de grasa. 
  6. En una olla a fuego lento, se disuelve el papelón en el agua y se añaden los clavos de olor. Se deja hervir y se cocina entre 20 y 25 minutos, o hasta que espese como melao. 
  7. Se retira del fuego y se eliminan los clavos. Se deja enfriar. 
  8. En una bandeja, se colocan las bolitas aún tibias y se bañan con el melao. 
  ### Sugerencia 
  - Se puede aromatizar el melao con 4 hojas de naranjo.
