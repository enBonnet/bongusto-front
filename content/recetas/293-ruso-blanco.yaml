historia: Se debe a una idea del barman del hotel Metropole de Bruselas Gustave Tops a fines de los años cuarenta, como cóctel para el embajador estadounidense en Luxemburgo, Pearl Mesta. Esta bebida no es de tradición rusa, sino que se le denomina así debido a la utilización de vodka como ingrediente principal.
ingredientes: |-
  - Vaso: (vaso old fashion)
  - Hielo: (Hielo Picado)
  - vodka
  - licor de café
  - Crema Batida o Ponche Crema
  **Decoración:**
  - Removedor de bebidas
  - Hoja de hierba buena 
  - Guinda
preparacion: |-
  - Agregar hielo al vaso (Lleno que sobresalga algo)
  - Servir 1 onza de Vodka
  - Servir 1 onza de licor de café
  - Remover
  - Completar con crema de leche o ponche crema
  **Decorar:**
  - Removedor de bebidas
  - Hoja de Hierba Buena (Nalgueada)
  - Guinda
