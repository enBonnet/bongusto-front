historia: El churro que conocemos hoy en México llego de España, pero se cree que la técnica de la fritura de la masa se originó en China y fue introducida en la Península Ibérica por los navegantes portugueses.
ingredientes: |-
  ### De 16 a 18 porciones 
  •	125 ml. leche entera
  •	125 ml. agua
  •	30 g. mantequilla
  •	150 g. harina de trigo
  •	1 cda. de azúcar
  •	2 huevos
  •	1 pizca de sal
  •	Aceite para freír
  •	Para decorar: Azúcar y 1 cdita de canela molida para rebozar
preparacion: |-
  •	En una olla añadimos la leche, el agua, 1 cda. de azúcar, sal y mantequilla. Calentamos hasta que se disuelva la mantequilla.
  •	En el momento en que esté comenzando a hervir la mezcla añadimos la harina. Con una cuchara de madera comenzamos a remover hasta que la harina se integre.
  •	Retiramos el cazo del fuego y añadimos los huevos que previamente habremos batido. Con unas varillas comenzamos a integrar los huevos. Inicialmente será un poco difícil, pero acabaremos consiguiendo una crema homogénea y lisa. 
  •	Ponemos la crema en una churrera (la mejor opción) o en una manga pastelera a la que le habremos colocado una boquilla en forma de estrella. Así daremos a los churros su característica forma estrellada.
  •	Calentamos abundante cantidad de aceite en un caldero o una sartén honda. Comenzamos a formar los churros añadiéndolos directamente, con la churrera (preferentemente) o la manga pastelera, sobre el aceite. Es importante pues después de todo el trabajo al hacer los churros los estropeemos en el aceite. No queremos que se nos pasen o se queden crudos por dentro.
  •	El aceite que tenemos en la sartén lo ponemos a fuego medio alto sin que llegue a humear, así evitaremos problemas con la fritura.
  •	Freímos durante 3 o 4 minutos hasta que veamos que se doran. Retiramos a una bandeja con papel de cocina para retirar el exceso de aceite. Vamos a dejar que los churros se reposen durante 10 minutos. El reposo es importante antes de rebozarlos en una mezcla de azúcar con una pizca de canela.
  •	Servimos al momento y disfrutamos solos o acompañados de un chocolate caliente, una leche o hasta un café. Cualquier cosa quedará de rechupete con estos riquísimos churros mexicanos.
