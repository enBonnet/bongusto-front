historia: |-
  EI origen de este plato, indispensable en nuestra mesa navideña, se remonta a la época de la 
  Colonia. Inicialmente se conoció con el nombre de pernil tovareño: la pierna del cerdo se horneaba entera, aderezada con especias, vino y un poco de azúcar. En las zonas frías, los preparados con alto contenido calórico son muy comunes, por lo que no es casual que este plato sea propio de la región andina.
  El pernil es una carne que adquiere fácilmente el sabor de los condimentos, por lo que queda muy gustosa y con sabor intenso. En otras versiones de preparación, se baña con cerveza, jugo de naranja o crema de cebollas. Al inyectarle vino al pernil antes de hornearlo, queda asegurado que la pieza estará bien impregnada de sabor y tendrá una jugosidad muy especial.
ingredientes: |-
  ### Ingredientes (para 10 o 12 personas) 
  - Un pernil de -cuarto trasero (se reconoce porque a veces tiene el rabito pegado), de apróx. 3 kg 
  - ¼ kg de pimentón, cortado en cuatro (sin venas ni semillas) 
  - ¾ kg de cebolla, cortada en cuatro 
  - ¼ kg de ají dulce, cortado en cuatro 
  - 1 cabeza de ajo pelada 
  - Orégano en hoja al gusto 
  - Comino en polvo al gusto 
  - Sal al gusto 
  - 1 cucharadita de pimienta negra molida 
  - 4 cucharadas de salsa inglesa 
  - 1 inyectadora de cocina 
  - 1 ½ litros de vino moscatel o vino de cocinar 
  - 1 cucharada de mantequilla 
  - 1 cucharadita de maicena (opcional)
preparacion: |-
  1. Se procesan o rallan los pimentones, las cebollas, los ajíes dulces y el ajo con el orégano, el comino, la sal, la pimienta y la salsa inglesa. 
  2. Se coloca el pernil en una bandeja. Se le inyectan 2 tazas de vino y se frota con parte de la mezcla licuada (jamás se debe pinchar con un cuchillo, porque pierde jugo y se seca la carne). Se deja marinando un día en la nevera, volteándolo con frecuencia.
  3. Seprecalientaelhornoa3500 C. 
  4. Se untan algunos puntos de mantequilla en la superficie del pernil y se baña con otras 2 tazas de y el resto de la mezcla licuada. 
  5. Se agrega una taza de agua al fondo de la bandeja. 
  6. Se hornea el pernil y se baña constantemente con su salsa, hasta que dore. 
  7. Para reconocer cuándo está cocido, se introduce un punzón fino: debe salir seco y del orificio no debe brotar líquido. Se demora alrededor de 3 horas (hora por kg) 
  8. Para la salsa que acompaña al pernil, se agrega 1 taza de agua a la bandeja, se calienta sobre el fuego y se desglasea (se raspa lo quemado). Se agrega el resto del vino y se deja hervir hasta que espese. 
  9. También se puede añadir la fécula disuelta en agua. Se añade sal al gusto y se cuela. 
  ### Sugerencia 
  - Acompañar con puré de papas o ensalada de gallina.
