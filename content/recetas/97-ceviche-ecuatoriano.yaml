historia: Ceviche o Cebiche, algunos les atribuyen el origen del nombre, a los marineros ingleses que al llegar a los puertos peruanos degustaban un plato típico al que ellos llamaban “SEA BEACH” (Pescado en la Playa) y el nombre viene derivado de esa denominación.
ingredientes: |-
  ### 4 porciones regulares o un tazón grande:
  - 1 kg.  De camarones ya cocinado, pelados y sin venas	
  - Sal y aceite
  - 2 cebollas moradas cortadas en pluma		
  - 1 manojo de cilantro picado finamente
  - 4 tomates, cortadas en juliana			
  - ½ taza de salsa de tomate
  - El jugo de 15 limones criollos			
  - El jugo de una naranja
preparacion: |-
  - Lavar las plumas de cebollas con sal y agua, luego enjuáguelas.
  - Mezcle todos los ingredientes y deje reposar en la refrigeradora por lo menos durante dos horas.
  - Sirva acompañado de tostones y/o chip de plátanos
