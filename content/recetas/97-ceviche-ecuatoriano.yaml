titulo: Ceviche Ecuatoriano
id: 97
descripcion: El ceviche de camarón es uno de los ceviches ecuatorianos más populares. El ceviche, también conocido como cebiche, es un plato tradicional muy popular en todo el Ecuador, pero sobre todo en la playa.
