historia: La palabra matambre, es una composición que viene de la unión de dos términos matar y hambre. Su origen remonta al 1800 cuando Argentina abastecía a Europa de carne vacuna y se solía pagar los faenadores con este tipo de cortes que saciaban su apetito, o mataban el hambre luego de la ardua faena.
ingredientes: |-
  ### 8 Raciones:
  - 2 kgs de falda preparada por un carnicero (rectángulo) 	
  - 2 hojas de laurel
  - 2 limones							
  - 2 lts de fondo
  - Sal y pimienta c/n						
  - 1 cdta de nuez moscada
  - 300 grs. Lomo de cerdo					
  - 6 huevos (dos cocidos)
  - 300 grs de carne 						
  - 1 taza de queso rallado
  - 2 manojos de espinaca					
  - 200 grs de jamón entero
  - 50 grs de margarina						
  - 2 cebollas
  - ½ taza de pan remojado en leche y exprimido
preparacion: Limpiar bien el matahambre quitándole la grasa extender y rociar con jugo de limón, salpimentar y reservar en nevera, aparte cortar las carnes de cerdo y res y pasar por el pica todo, luego lavar las espinacas y cocinar con sal, cuando ablanden cortar la cocción con agua fría y exprimir y cortar, aparte cortar la cebolla en pluma y rehogar en margarina, cortar el jamón en cubos, mezclar la espinaca la cebolla rehogada, las carnes, el jamón y la miga de pan y queso rallado, agregue los huevos y sazone al gusto con sal pimienta y nuez moscada. Luego doble la falda y cosa hasta hacer una bolsa, introduzca el relleno y los huevos duros cosa y envuelva en una tela de algodón la pieza y cocine por dos horas, al estar listo prensar para sacar los líquidos refrigerar y cortar.
