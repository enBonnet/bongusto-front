historia: Hoy vamos a hablar de un plato fusión de comida española y venezolana, muy popular en Venezuela y dentro de nuestra gastronomía está considerado uno de los platos más deliciosos y emblemáticos. Se ha hablado que tuvo su origen en el polvorón español, otros estudiosos dicen que este guiso de pollo tiene su origen en la galantina de pollo, plato venezolano del siglo XIX., para derivar en lo que hoy conocemos como Polvorosa de Pollo. Este delicioso plato no podría preparase si no existiese el intercambio económico y cultural que se comenzó con el descubrimiento de América.
ingredientes: |-
  ### Para 10 o 12 personas
  ### Para adobar el pollo
  - 1 pollo entero
  - 1 cucharada de mantequilla
  - 1/3 de taza de jugo de cebolla
  - 1 cucharadita de salsa inglesa (Worcestershire)
  - 2 dientes de ajo machacados
  - 1 1/2 cucharaditas de vinagre
  - 2 cucharaditas de sal
  - 1/4 de cucharadita de pimienta negra
  - 1 limón
  ### Para freír el pollo
  - 2 cucharadas de mantequilla
  - 1 cucharada de aceite
  ### Para el sofrito
  - 3 cucharadas de mantequilla
  - 2 cucharadas de aceite
  - 1/2 taza de ajoporro cortado finamente
  - 2 tazas de cebolla en brunoise
  - 3 dientes de ajo majado
  - 1/4 de taza de cebollín cortado finamente
  - 2 1/2 cucharadas de pimentón rojo en brunoise
  - 2 tazas de tomate concasse
  - 3 cucharadas de perejil en hache
  - 2 cucharadas de encurtidos en mostaza en brunoise
  - 1/3 de cucharadita de ají picante seco y molido
  - 50 gramos de papelón
  - 1 hoja de laurel
  - 1/2 taza de vino moscatel
  - 1 cucharada de salsa inglesa (Worcestershire)
  - 1 cucharadita de sal
  - 1/2 cucharadita de pimienta negra
  - 1 cucharada de alcaparras
  - 4 cucharadas de pasas
  ### Para la masa
  - 125 gramos de mantequilla
  - 180 gramos de manteca vegetal
  - 3/4 de taza de azúcar pulverizada
  - 4 yemas de huevo
  - 1 cucharadita de sal
  - 1/2 kilo de harina de trigo
preparacion: |-
  ### Para el guiso
  1. Quitar el exceso de grasa al pollo. Lavar y frotar con limón. Luego, secar con papel absorbente y cortar en presas.
  2. Preparar una marinada mezclando la mantequilla, el jugo de cebolla, la salsa inglesa, el ajo, el vinagre, la sal y la pimienta. Seguidamente, frotar el pollo con la mezcla y dejar marinando por una hora dándole vuelta de vez en cuando.
  3. En un caldero, calentar las dos cucharadas de mantequilla y la cucharada de aceite. Limpiar bien de la marinada y agregar las presas al caldero. Dorarlas bien por cada lado. Sacar y reservar en una bandeja profunda. Agregar el sobrante del adobo al caldero. Revolver y sofreír para luego verter a través de un colador sobre el pollo. Reservar.
  4. Calentar en el caldero las tres cucharadas de mantequilla y las dos de aceite para hacer el sofrito. Agregar el ajoporro, la cebolla, el ajo y el cebollín. Sofreír por cinco minutos. Agregar el pimentón, el tomate y el perejil. Cocinar por 10 minutos
  5. Colocar nuevamente el pollo con su salsa en el caldero. Agregar al encurtido, el ají, el papelón, la hoja de laurel, el vino, la salsa inglesa, la sal y la pimienta. Poner a fuego suave y tapar. Cocinar hasta ablandar el pollo, unos 30 a 35 minutos. Agregar las alcaparras y las pasas, revolver y cocinar dos minutos más. Retirar del fuego. Sacar del caldero las presas de pollo, poner aparte para enfriar y eliminar el exceso de grasa de la salsa.
  6. Quitar la piel al pollo y poner aparte. Cortar la carne en pedacitos. En una trituradora, poner parte de la piel y un poquito de la salsa de pollo. Triturar y agregar nuevamente a la salsa. Poner el pollo y la salsa a enfriar por separado.
  7. Precalentar el horno a 350 grados.
  ### Para la masa
  1. En un envase, poner la mantequilla y la manteca vegetal. Revolver bien y agregar el azúcar. Mezclar bien con una cuchara de madera y agregar una a una las yemas de huevo. Agregar la sal y, poco a poco, la harina cernida. Mezclar muy bien con la cuchara y luego terminar de unir con la punta de los dedos, sin amasar.
  ### Montaje final
  1. Dividir la pasta en dos partes un poco desiguales. Poner la parte mayor sobre un papel encerado, colocado a su vez sobre una mesa, cubrir la pasta también con papel encerado y extender con un rodillo hasta tener un pedazo de unos 50 x 35 centímetros, un poco más grande que el molde a utilizar y de un centímetro de espesor. Quitar el papel de arriba y con cuidado, voltear la pasta sobre un molde de vidrio para hornear de 30 x 20 x 5 centímetros, teniendo cuidado que sobre pasta por todos los lados del molde. Con los dedos, forrar el fondo y las paredes del molde.
  2. Meter el molde en el horno y hornear hasta que comience a dorar, unos 15 minutos. Sacar el molde del horno y dejar reposar varios minutos.
  3. Rellenar el molde poniendo primero una capa abundante de salsa o guiso, una capa de pollo bien distribuida y acomodada, otra capa de salsa o guiso, otra capa de pollo y, finalmente, cubrir con la salsa restante.
  4. Siguiendo el mismo procedimiento que se utilizó en el punto anterior para extender la masa inferior del pastel, extender la masa restante para cubrir el molde. Con un cuchillo, cortar los bordes sobrantes. Con la masa sobrante, formar un cordoncito con el cual se sellan los bordes apretando con los dedos en puntos cercanos.
  5. Meter el pastel en el horno precalentado a 350 grados y hornear por unos 55 minutos o hasta dorar un poco. Si se observa tendencia a dorar mucho por las orillas, puede cubrirse con papel encerado. Sacar el pastel del horno y servir.
