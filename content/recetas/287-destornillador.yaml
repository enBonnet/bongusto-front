historia: |-
  Se desconoce el origen tanto del cóctel como del motivo de su nombre, aunque las diferentes historias apuntan principalmente a tres teorías: la primera, que fue creado durante la Ley Seca estadounidense (1920–1933), en la que se simulaba beber un inocente jugo de naranja mientras se estaba ingiriendo vodka. Una segunda hipó tesis asocia el destornillador con la Segunda Guerra Mundial, donde los soldados británicos recibían una lata de jugo de naranja por cabeza y ellos la adulteraban con vodka. La última teoría relaciona este cóctel con obreros estadounidenses que durante los años 50 estuvieron trabajando en perforaciones petrolíferas en el Golfo Pérsico, quienes sólo disponían de un destornillador para remover la mezcla.
  Aunque no se conozca a ciencia cierta su origen, este cóctel está asociado a los Estados Unidos, ya en la edición del 24 de octubre de 1949 de la revista Times se refieren al Screwdriver como «el último invento norteamericano».
ingredientes: |-
  - Vaso: High ball (H.B)
  - Hielo en cubos (H.C)
  - Curacao o Triple “C”
  - Vodka
  - Jugo de Naranja (Preferiblemente Pasteurizado)
  **Decoración: **
  - Rebanada de Naranja
  - Cereza 
  - Removedor de Bebidas
  - Pitillos o Pajillas
preparacion: |-
  - Agregar al vaso alto hielo en cubos 
  - Agregar sobre el hielo un Dash de Curacao o Triple “C”
  - Agregar ½ onza de Vodka
  - Alargar con jugo de naranja
  **Decorar:**
  - Colocar removedor de bebidas y pitillo
  - Colocar rodaja de naranja y cereza
