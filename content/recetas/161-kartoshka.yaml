historia: La Kartoshka es un postre de origen soviético que se preparaba en restaurantes, así como también en casas y en comedores estudiantiles. Su gran popularidad se debe a que permite reciclar los restos de bizcochos y galletas rotas. En tiempos difíciles, se utilizaba incluso el pan. Aunque esta receta surgió en el siglo XX, se ha popularizado durante la época soviética y continúa siendo uno de los postres preferidos de los rusos. Hay muchísimas variantes de esta receta, ya sea a base de bizcochos, pan tostado o galletas. Aunque los puedes encontrar en cualquier cafetería, lo mejor es hacerlos en casa.
ingredientes: |-
  ### 4 porciones
  - 200 gr. de galletas			
  - 70 gr. de mantequilla
  - 70 gr. de leche condensada		
  - 100 grs de maní sin sal
  - 50 ml. del licor que más te guste	Un poco de Cacao en polvo sin azúcar para espolvorear
  - Decorar al gusto: Gotas de queso crema, azúcar glas, caramelos, etc…
preparacion: |-
  Trituramos las galletas con un robot de cocina hasta conseguir que se conviertan en polvo. También puedes ayudarte de un rodillo de cocina, introduciendo las galletas en una bolsa y golpeándolas con el rodillo hasta conseguir que estén completamente pulverizadas.
  Derretimos la mantequilla en el microondas o baño de maría y se la añadimos a las galletas, al igual que la leche condensada, el licor y los maní.
  Mezclamos bien todos los ingredientes hasta que se integren y seamos capaces de formar bolas, como si fuesen croquetas.
  Vamos dándoles forma de croquetas y colocándolas en una fuente. Cuando terminemos con todas, las meteremos en la nevera durante 1 hora aproximadamente.
  Pasada esa hora, rebozamos los pastelitos con cacao en polvo. Cortamos una esquinita y vamos decorando cada Kartoshka con tres o cuatro puntitos de la decoración escogida, emulando lo que serían los brotes que a veces presentan las papas.
