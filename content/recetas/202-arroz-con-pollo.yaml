historia: |-
  Conocido en la Caracas del siglo XIX como pollo en arroz, éste es un plato principal en el cual el popular cereal trasciende su usual condición de acompañante, pues absorbe los sabores y colores del sofrito y del pollo. Por aquel entonces, la receta llegó incluso a dotarse de un distintivo político, según palabras de Ramón David León: en La Victoria: se le añadía 
  onoto para teñirlo de amarillo y rendirle. así homenaje al general Francisco Linares Alcántara. (cabeza del liberalismo amarillo); en Villa de Cura (en algún momento de dominio godo) se le agregaba un porcentaje más alto de este colorante natural para que el arroz luciera 
  rojo, símbolo de los conservadores. Más adelante, en Maracay, ya en tiempos de Gómez (cuyo color distintivo era el blanco), se comía este plato sin colorearlo en absoluto, como tributo al benemérito. 
  Hasta bien entrado el siglo XX, decir "un arroz" o "un arrocito" era sinónimo de fiestas bailables, porque no faltaba un arroz con huesitos o con pollo. El que nunca dejaba de comer en esas celebraciones era todo un "arrocero". No es de extrañar que actualmente esta palabra haya quedado para los que asisten, aun sin invitación, a todas las fiestas.
ingredientes: |-
  ### Ingredientes (para 6 personas) 
  ### Sofrito 
  - 2 cucharadas de aceite 
  - 1 cebolla cortada en brunoise 
  - 1 pimentón cortado en brunoise
  - 1 ajoporro cortado en brunoise
  - 1 zanahoria cortada en brunoise
  - 6 ajíes dulces cortados en brunoise
  - 1 ramita de cilantro en hache 
  - 8 dientes de ajo majados
  Sal al gusto 
  ### Cocción 
  - 5 pechugas de pollo cortadas en cuadros, sin prescindir de los huesitos 
  - 2 ½ tazas de arroz 
  - 4 tazas de consomé de pollo. 
  - 3 cucharadas de aceite onotado
preparacion: |-
  - Se saltean a fuego bajo los ingredientes sólidos del sofrito, con sal al gusto. 
  - Cuando la cebolla esté dorada, se añade el pollo, y se mueve regularmente durante unos 4 minutos. 
  - Se agrega el arroz y se sofríe todo por unos 2 minutos más. 
  - Se añade el consomé de pollo, el aceite onotado y se sube un poco el fuego. Sin remover, ya fuego medio, se espera a que hierva. 
  - Se baja el fuego y se tapa. Se esperan unos 3 minutos y se remueve un poco. Se tapa de nuevo y se espera hasta que el agua se absorba completamente. 
  - Sugerencia 
  - Para darle más coloración al arroz, al final se puede añadir 1 cucharada más de aceite onotado.
