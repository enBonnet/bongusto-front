historia: Chips. Se trata de tajadas redondas muy finas. Generalmente se usa en papas, camotes y plátanos. El corte es más parejo y preciso si se utiliza mandolina.
ingredientes: |-
  - 8 a 10 pzas. Rábanos
  - 2 cdas. Aceite de oliva
  - 1 pza. Limón
  - 1 cdta. Cebolla en polvo
  - al gusto Sal
  - al gusto Pimienta
preparacion: |-
  - Para comenzar esta receta vamos a cortar los rábanos en rodajas o chips es importante cortarlos muy delgados para que queden crujientes, si cuentas con una mandolina quedan mejor.
  - Colocar las rodajas en un molde o refractario, colocar de forma que las rodajas se toquen lo menos posible entre sí, darles espacio permite que se cocinen de forma más uniforme y queden más crujientes.
  - Una vez así vamos a rociar el aceite distribuyendo por toda la superficie para bañar muy bien los rábanos.
  - Espolvorear la cebolla en polvo, el jugo de limón y también sal y pimienta al gusto. Asegúrate de distribuir muy bien.
  - Hornear a 180°c por 10 minutos aproximadamente o hasta que queden crujientes y ligeramente dorados.
  - Retirar del horno y dejar enfriar antes de servir para evitar que se rompan o deshagan.
