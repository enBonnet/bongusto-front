historia: |-
  La carbonade es un plato tradicional belga (de las regiones de Flandes belga) también presente en las cocinas del norte de Francia (regiones de Flandes francés, Artois, Norte-Paso de Calais). Se trata de un estofado de ternera y cebolla cocinado en cerveza y sazonado con tomillo y laurel.
  Su nombre se deriva del italiano “carbonata”, que se usa para designar a los alimentos que se cuecen a la brasa.
ingredientes: |-
  - 1 kgr. carne de ternera (o res), en cubos de 3*3, 
  - 50 gr. mantequilla, 
  - sal, 
  - pimienta negra, 
  - 3 cebollas en julianas, 
  - 20 gr. azúcar moreno de caña, 
  - medio litro de cerveza negra, 
  - 1 rebanada de pan, 
  - 1 cucharada de vinagre de vino blanco, 
  - 1 cucharada de mostaza Dijon, 
  - 1 bouquet garni (perejil, laurel, tomillo fresco, etc.)
preparacion: |-
  - En una olla calienta la mantequilla. Cuando esté derretida añade la carne, salpimentada y cortada en cubos gruesos. Deja dorar removiendo y retira. 
  - En la misma grasa que queda en la olla saltea las cebollas. Cuando están transparentes añade el azúcar de caña y la cerveza negra.
  - Deja cocer unos minutos, añade el vinagre, el pan desmigado, la mostaza y la carne reservada, con sus jugos. 
  - Incorpora el bouquet garni y deja cocer a fuego muy lento y tapado unas dos horas, o hasta que la carne quede muy tierna, removiendo de vez en cuando.
  - Acompañar con:
  - Papas fritas y Ensalada mixta
