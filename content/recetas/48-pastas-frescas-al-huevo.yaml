historia: Son muchas las teorías que se han elaborado en torno al origen de la pasta. Algunos investigadores adjudican el descubrimiento a Marco Polo en el siglo XIII, el cual la introdujo en Italia de vuelta de uno de sus viajes a China, en 1271. En el capítulo CLXXI de “Libros de Maravillas del mundo”, Marco Polo hace referencia sobre la pasta en China. Para otros se remonta mucho más allá, a antiguas civilizaciones etruscas, que la elaboraban mediante el machaque o trituración de diversos cereales y granos mezclados con agua, que luego cocían y resultando un alimento sabroso y nutritivo.
ingredientes: |-
  ### Insumos para la pasta: (Para Una porción de pasta)
  - 100 grs de harina de trigo T/U.						
  - 1 huevo,
  - Pizca de sal,
  - 1 cda de aceite
  - Agua C/N.
preparacion: |-
  ### Preparación:
  - a.	En un bol o sobre el mesón formar un volcán con la harina.
  - b.	Dentro de la cavidad del volcán incorporar el huevo y el aceite
  - c.	Sobre la harina esparcir la sal.
  - d.	Se procede a incorporar desde el centro asía afuera, hasta incorporar toda la preparación.
  - e.	Amasamos hasta conseguir una masa suave y moldeable. De ser necesario para suavizarla solo nos humedecemos las manos durante el amasado.
  - f.	Se coloca en una bolsa plástica y se deja reposar por ½ hora. 	
  - Luego elaboramos la pasta de nuestra preferencia, y se agrega en una olla con suficiente agua hirbiendo y un toque de sal. Esta lista en tres minutos o cuando flote.
