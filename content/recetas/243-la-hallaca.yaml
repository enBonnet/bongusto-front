historia: Este plato es el alma de la cena navideña y una de las creaciones originales de la cocina venezolana que más placer, satisfacción y orgullo generan entre nosotros. Su elaboración, generalmente convertida en encuentro amistoso y familiar, es una verdadera ceremonia parcipativa en la que se distribuyen tareas a los participantes (cocinar, amasar, envolver, amarrar), incluso a los más pequeños de la casa. Asociable a los tamales, en su preparación.
ingredientes: |-
  ### Ingredientes (para 50 unidades) 
  - 3 kg de pernil de cochino con poca grasa 
  - 5 limones cortados por la mitad 
  - ½ kg de tocino 
  - 2 gallinas de 2 kg cada una, cortadas en partes o presas y sin piel 
  - 1 taza de aceite de maíz 
  - 6 tazas de cebolla en brunoise 
  - 4 tazas de ajoporro en brunoise
  - 2 tazas de cebollín cortado en ruedas delgadas 
  - 3 ¼ de taza de dientes de ajo majados 
  - ½ taza de alcaparras pequeñas en h taza de caldo de gallina 
  - 1 kg de pimentón rojo, rallado (sin piel ni semillas) 
  - 5 tazas de tomate rallado (sin piel ni semillas) 
  - 4 ajíes dulces picados en trozos pequeños 
  - 1 cucharada de ají picante en brunoise 
  - 1 taza de encurtidos de mostaza triturados 
  - 1 taza de vino blanco 
  - 300 gramos de papelón rallado 
  - 1 cucharada de pimienta negra molida 
  - 2 cucharaditas de páprika 
  - 5 cucharadas de sal 
  - cucharadita de mostaza preparada 
  - 2 tazas de caldo de gallina 
  ### Masa 
  - 5 tazas de manteca vegetal o manteca de cochino 
  - 6 cucharadas de semillas de onoto 
  - 5 kg de masa de maíz blanco pilado 
  - 3 tazas de caldo de gallina 
  - 2 cucharaditas de sal 
  - 1 ½ tazas de agua
  ### Nota: Se puede emplear también harina de maíz precocida. En este caso las proporciones serían: 4 kg de harina, 1 litro de caldo de gallina, 4 litros de agua y la misma cantidad de manteca onotada.
  ### Adorno 
  - ½ kg de tocino (el que se cocinó con el pernil), cortado en tiras largas: 2 por hallaca.
  - 1 kg de pimentón rojo, sin piel ni semillas, cortado en tiras delgadas: 2 por hallaca 
  - 150 gramos de almendras peladas: 2 por hallaca 
  - ½ kg de cebollas medianas, cortadas en aros delgados: 3 aros por hallaca 
  - 150 gramos de alcaparras pequeñas, escurridas: 4 por hallaca 
  - 500 gramos de aceitunas verdes medianas rellenas, escurridas: 2 por hallaca 
  - 250 gramos de pasas sin semillas: 6 por hallaca 
  - 250 gramos de encurtidos en vinagre, escurridos y cortados en trozos pequeños: 5 pedacitos por hallaca 
  ### Envoltura 
  - 10 kg de hojas de plátano para hallacas (previamente asadas) 
  - 2 rollos de pabilo
preparacion: |-
  ### Guiso 
  1. Se limpia el pernil de cochino y la gallina, frotándolos con limón y lavándolos luego 
  2. con agua. 
  3. En una olla con agua hirviente, se cocina el cochino y el tocino, a fuego medio, por 10 
  4. minutos. Se retiran y se cuelan las carnes (se desecha el líquido). El pernil se deja enfriar y se corta en cuadros pequeños; el tocino se corta en tiras y se reserva para el adorno. 
  5. En otra olla con abundante agua, se cocina la gallina a fuego medio por 4 horas o hasta que ablande, pero no demasiado (si se va a usar una olla de presión, se recomienda cocinarla sólo 35 minutos). Se retira del fuego, se cuela y se reserva el líquido: en ½ taza de caldo se remojan las alcaparras y el resto se guarda para usarlo en la preparación del guiso y de la masa. Se deja enfriar la gallina y se desmecha en tiras de no más de 6 cm de largo. 
  6. En una olla grande se vierte el aceite y a fuego alto se sofríe la cebolla, el ajoporro y el cebollín por 5 minutos o hasta que marchiten. Se añade el ajo y las alcaparras en caldo de gallina y se cocina a fuego medio por 15 minutos o hasta que hierva. 
  7. Se agregan los pimentones, los tomates, los ajíes dulces, el ají picante y los encurtidos y se deja cocinar por 10 minutos a fuego medio. 
  8. Se añade el vino, el papelón, la pimienta, la paprika, la sal, la mostaza y las 2 tazas de caldo de gallina, y Se cocina a fuego medio durante 15 minutos o hasta que hierva. 
  9. Pasado ese tiempo, se agrega el cochino, se tapa y se cocina a fuego medi0idurante 40 minutos. Luego se añade la gallina y se cocina durante 30 minutos más, cuidando que no se deshagan las carnes, Se prueba y se rectifica el punto de sal. 
  10. Se retira del fuego y se deja enfriar (generalmente, este procedimiento se hace con un día de anticipación). Si el guiso queda muy líquido, se puede espesar con una cucharada de harina de maíz disuelta en agua. 
  ### Preparación de las hojas 
  1. Se lavan las hojas cuidadosamente con agua, se escurren y se secan muy bien con un paño. 
  2. Con una tijera, se eliminan las venas gruesas y se clasifican las hojas por tamaño: grandes (se usarán como principal soporte de la preparación, en la parte inferior), medianas (que se utilizarán como segunda envoltura) y fajas (tiras de unos 15 cm, que ayudarán como ajuste final, antes de proceder al amarrado). 
  ### Masa 
  1. En una sartén, se calientan a fuego bajo 2 tazas de manteca vegetal y el onoto. Tan pronto la manteca se tiña de color caramelo, se retira del fuego, se cuela y se desechan los granos. Se reserva para darle color a la masa y engrasar las hojas.
  2. Se coloca la masa en un recipiente hondo y se agregan 2 tazas de manteca sin color y 1 taza de la coloreada. 
  3. Se añade el caldo de gallina, la sal y el agua y se amasa hasta lograr una consistencia fina y suave. Se tapa con un paño húmedo y se reserva. (Se puede corregir la textura o el color de la masa añadiéndole una mayor cantidad de alguno de los ingredientes para el amasado). 
  4. Se hacen bolitas del tamaño de una naranja. 
  ### Ensamblaje de la hallaca 
  1. En una mesa grande se organizan todos los ingredientes de la hallaca: las hojas clasificadas en sus tres tamaños, la masa, la manteca onotada, el guiso, los adornos por separado y el pabilo para el amarrado.
  2. Se escoge una hoja grande. Se engrasa con la manteca de onoto y, en el centro, se coloca la bola de masa. Se cubre con un plástico y se aplana (con un rodillo, una prensa, una tabla, un plato plano o con las manos) hasta lograr que quede bien pareja y delgada. 
  3. En el centro de la masa se coloca media taza de guiso (tibio o frío) y encima se distribuyen los adornos: 2 tiras de tocino, 2 tiras de pimentón, 2 almendras, 3 aros de cebolla, 4 alcaparras, 2 aceitunas, 6 pasitas y 5 trocitos de encurtidos. 
  4. Se desprenden de la hoja dos de los lados de la masa y se hacen caer sobre el relleno. Se toman los bordes longitudinales de la hoja, se unen y se doblan juntos. Se doblan luego los otros dos extremos, llevándolos al centro de la hallaca. 
  5. Se coloca una hoja mediana tapando el doblez de la hoja grande, se voltea la hallaca y se dobla la hoja igualmente en cuatro: primero dos lados hacia el centro y luego los otros dos. 
  6. Se rodea la hallaca con la faja. 
  7. Se amarra con pabilo de manera tal que no quede muy prensada, para que las hojas no se rompan, ni muy floja, para que no le entre agua durante la cocción: se pasa el hilo por debajo de la hallaca y se llevan los extremos hacia arriba y al centro, se cruzan (y se gira la hallaca) para luego pasarlos por los otros dos lados. El hilo debe formar una cruz cada vez que se la hallaca se gira, Se repite este proceso otras 5 veces, siempre sobre puntos distintos, y se termina el amarrado con un nudo o lazo. 
  ### Cocción 
  1. En una olla grande se calienta a fuego alto abundante agua con sal, y al hervir se introducen las hallacas (deben quedar cubiertas por el agua). Arriba de ellas se colocan hojas de plátano sobrantes, para mantenerlas sumergidas y aromatizar la cocción. 
  2. Se tapa y se deja cocinar durante 1 hora (a mitad de cocción, se voltean las que quedaron más arriba). 
  3. Se retiran de la olla, se escurren ligeramente inclinadas y se dejan enfriar. Si no se comen el mismo día, se guardan en la nevera (donde pueden conservarse por cuatro semanas). 
  4. Para servir, se desatan y se colocan sobre el plato con o sin las hojas. 
  5. Para recalentar, se colocan en agua hirviente con sal durante 20 minutos; si se hace al vapor, 
  6. necesitan 30 minutos; y si es en el horno precalentado a 200°C, 30 minutos (preferiblemente envueltas en papel de aluminio). 
  ### Sugerencia 
  - Con los sobrantes de la masa, del guiso y de los demás ingredientes, mezclados, se pueden elaborar bollos de hallaca. Se envuelven y se amarran como las hallacas, pero con una señal distintiva (puede ser otro tipo de amarrado o menor para poder reconocerlos y diferenciarlos.
