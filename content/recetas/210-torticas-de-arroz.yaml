historia: "Esta sencilla y rápida receta es ideal para aprovechar el arroz ya cocinado que ha perdido la frescura o suavidad ser refrigerado: basta mezclarlo con huevo y harina, poner (si se quiere) un poco de queso, y freírlo. También llamadas fritas, estas torticas son apropiadas como contorno de otros preparados o en las meriendas."
ingredientes: |-
  ### Ingredientes (para 4 personas) 
  - 4 tazas de arroz ya cocido (sobrante de una comida anterior) 
  - 4 huevos 
  - 8 cucharadas de queso blanco duro rallado 
  - ½ taza de aceite 
  - Papel absorbente 
  - ½ taza de azúcar
preparacion: |-
  1. En un envase, se mezclan el arroz, los huevos, azúcar y el queso. 
  2. En una sartén caliente, con el aceite, se vierten cucharadas de la mezcla (sin que se sobrepongan) y se cocinan a fuego medio por ambos lados hasta que doren.
