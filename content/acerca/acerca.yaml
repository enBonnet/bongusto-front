biografia: |-
  Mi nombre es Antonio Bonnet, soy maestro en artes culinarias, egresado de la 2da promoción de la Universidad Central de Venezuela, campus de la facultad de agronomía de Maracay, estado Aragua (Venezuela). No digo nunca que soy un Chef, soy un cocinero profesional, que esta dedicando su carrera como Chef Instructor. He impartido clases de cocina en diferentes academias y en la Universidad Bicentenaria (Escuela de Cocina INGENIUM) y Actualmente al 100% en la Universidad de Carabobo, campus la Morita del Estado Aragua (Venezuela).
  Considero mi carrera como cocinero profesional, la mejor de mi vida, ya que a lo largo de mi existencia he ejecutado y trabajado otras profesiones, que en su momento fueron satisfactorias, pero, siempre desde muy temprana edad sentía inclinación por la cocina. En una de esas encrucijadas que se te presentan en la vida, entro a estudiar cocina aupado por mi hijo menor, quien ya estudiaba cocina, en la referida Universidad, de hecho, él es de la 1ra promoción. En ese momento le dije, bueno voy a estudiar solo el básico, pero me apasione y en menos de lo que esperaba ya estaba graduado. Y no solo fui uno de los mejores de mi promoción, sino que mis instructores me ofrecieron ser docente de cocina. Lo cual pensé y dije bueno solo lo hare por uno que otro día, ya que yo tenia un negocio, el cual tenia que atender. Como cosas del destino el negocio desapareció de forma violenta, y ni modos me dedique solo a enseñar gastronomía.
  Actualmente he complementado mi carrera con diferentes especializaciones, que no solo me han ayudado a inflar mi currículo, si no mis conocimientos y así mejoro la calidad de lo impartido a mis alumnos.
  Las materias en las que me desempeño mejor son:
  - Cocina Básica
  - Cocina Francesa
  - Cocina Latinoamericana
  - Cocina Internacional
  - Cocina Mediterránea
  - Cocina a la Vista del Cliente
  - Coctelería
  - Servicio de Comedor
  - Costos
  - Pastas y Salsas
  - Panadería Artesanal
  - Chocolatería y Bombonería
  - Vinos
  - Decoración con Frutas y Vegetales (Mukimono)

  En resumidas cuentas, siempre le manifiesto a mis alumnos que, si no fuese por la necesidad de comer, yo aria este trabajo de GRATIS. Por que yo siento que no trabajo estoy en mi elemento y estoy cómodo.
  Cito: Elige un trabajo que te guste y no tendrás que trabajar ni un día de tú vida. Confucio 551-478 AC. (Filosofo chino)
