[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# www is the canonical host (astro.config.mjs `site`, sitemap, robots.txt) and
# the form the old site was indexed under. Needs www set as the primary domain
# in Netlify's Domain management too, or the two redirects loop.
[[redirects]]
  from = "https://bongusto.net/*"
  to = "https://www.bongusto.net/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# pagefind assets are content-hashed → cache hard; entry points get short TTL
[[headers]]
  for = "/pagefind/fragment/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/pagefind/index/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
